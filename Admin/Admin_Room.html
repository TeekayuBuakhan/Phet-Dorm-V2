    <script>
        const modal = document.getElementById('modalOverlay');
        const deleteModal = document.getElementById('deleteModalOverlay');
        const infoModal = document.getElementById('infoModalOverlay');
        const tbody = document.getElementById('roomsBody');
      
        let rowToDeleteNum = null;
        let currentRoomInfo = '';

        const defaultData = [
            { roomNum: '23A', roomType: 'พัดลม', price: '1,900', tenantName: 'เจษฎา พรมภิบาล', phone: '066-089-0158', debt: 0 },
            { roomNum: '12B', roomType: 'แอร์', price: '2,500', tenantName: 'นกกระจอกเทศ มะพร้าวอ่อน', phone: '082-222-2222', debt: 0 },
            { roomNum: '67C', roomType: 'แอร์', price: '2,500', tenantName: 'มงคล ไดโนซอซา', phone: '054-432-1999', debt: 2 },
            { roomNum: '69C', roomType: 'พัดลม', price: '1,900', tenantName: '-', phone: '-', debt: 0 }
        ];

        if (!localStorage.getItem('dormRoomsData')) {
            localStorage.setItem('dormRoomsData', JSON.stringify(defaultData));
        }

        function getRoomsData() {
            return JSON.parse(localStorage.getItem('dormRoomsData')) || [];
        }

        function getRoomData(roomNum) {
            const data = getRoomsData();
            return data.find(r => r.roomNum === roomNum) || { roomNum, roomType: '-', price: '-', tenantName: '-', phone: '-', debt: 0 };
        }

        function renderTable() {
            const data = getRoomsData();
            tbody.innerHTML = ''; 
          
            data.forEach(room => {
                const isOccupied = room.tenantName && room.tenantName.trim() !== '' && room.tenantName !== '-';
                const statusHtml = isOccupied
                    ? `<span class="inline-block bg-red-100 text-red-600 font-bold rounded-full px-3 py-1 text-xs border border-red-200">ไม่ว่าง</span>`
                    : `<span class="inline-block bg-green-100 text-green-700 font-bold rounded-full px-3 py-1 text-xs border border-green-200">ว่าง</span>`;

                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-50 hover:bg-gray-50/50 transition-colors';
                tr.innerHTML = `
                    <td class="py-4 px-4 font-bold text-gray-800">${room.roomNum}</td>
                    <td class="py-4 px-4">${statusHtml}</td>
                    <td class="py-4 px-4 text-gray-700">${room.roomType || '-'}</td>
                    <td class="py-4 px-4 text-gray-700">${room.price || '-'}</td>
                    <td class="py-4 px-4 text-gray-700">${room.tenantName}</td>
                    <td class="py-4 px-4">
                        <button class="btn-more text-gray-400 hover:text-phet-orange transition-colors flex justify-center w-full focus:outline-none" data-room="${room.roomNum}" title="ดูข้อมูล">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 pointer-events-none">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                            </svg>
                        </button>
                    </td>
                    <td class="py-4 px-4">
                        <button class="btn-delete text-gray-400 hover:text-red-500 transition-colors flex justify-center w-full focus:outline-none" data-room="${room.roomNum}" title="ลบห้อง">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 pointer-events-none">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                            </svg>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        renderTable();

        document.getElementById('openAddRoomBtn').addEventListener('click', () => modal.classList.replace('hidden','flex'));
        document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
      
        function closeModal() {
            modal.classList.replace('flex','hidden');
            document.getElementById('newRoomNum').value = '';
            document.getElementById('newRoomPrice').value = '';
        }

        document.getElementById('saveModalBtn').addEventListener('click', () => {
            const num   = document.getElementById('newRoomNum').value.trim();
            const type  = document.getElementById('newRoomType').value;
            const price = document.getElementById('newRoomPrice').value.trim();
            if (!num || !price) { alert('กรุณากรอกข้อมูลให้ครบถ้วน'); return; }
          
            const existingData = getRoomsData();
            if (existingData.some(r => r.roomNum === num)) {
                alert('มีเลขห้องนี้อยู่ในระบบแล้วครับ');
                return;
            }

            existingData.push({ roomNum: num, roomType: type, price: price, tenantName: '-', phone: '-', debt: 0 });
            localStorage.setItem('dormRoomsData', JSON.stringify(existingData));
 
            renderTable(); 
            closeModal();
        });

        tbody.addEventListener('click', e => {
            const deleteBtn = e.target.closest('.btn-delete');
            if (deleteBtn) {
                rowToDeleteNum = deleteBtn.getAttribute('data-room');
                deleteModal.classList.replace('hidden', 'flex');
                return;
            }
            const moreBtn = e.target.closest('.btn-more');
            if (moreBtn) {
                const roomNum = moreBtn.getAttribute('data-room');
                currentRoomInfo = roomNum;
              
                const roomInfo = getRoomData(roomNum);
              
                document.getElementById('infoRoomNum').innerText = roomInfo.roomNum;
                document.getElementById('infoTenantName').innerText = roomInfo.tenantName;
                document.getElementById('infoPhone').innerText = roomInfo.phone;
              
                const debtBadge = document.getElementById('infoDebtBadge');
                if (roomInfo.debt > 0) {
                    debtBadge.innerText = `ค้างชำระ ${roomInfo.debt} บิล`;
                    debtBadge.classList.replace('hidden', 'inline-block');
                } else {
                    debtBadge.classList.replace('inline-block', 'hidden');
                }
                infoModal.classList.replace('hidden', 'flex');
            }
        });

        document.getElementById('closeDeleteBtn').addEventListener('click', () => {
            deleteModal.classList.replace('flex', 'hidden');
            rowToDeleteNum = null;
        });

        document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
            if (rowToDeleteNum) {
                let data = getRoomsData();
                data = data.filter(r => r.roomNum !== rowToDeleteNum);
                localStorage.setItem('dormRoomsData', JSON.stringify(data));
                renderTable(); 
              
                rowToDeleteNum = null;
                deleteModal.classList.replace('flex', 'hidden');
            }
        });

        document.getElementById('closeInfoBtn').addEventListener('click', () => {
           infoModal.classList.replace('flex', 'hidden');
        });

        document.getElementById('editDataBtn').addEventListener('click', () => {
            window.location.href = `editRoom.html?room=${currentRoomInfo}`;
        });

        window.addEventListener('click', e => {
            if (e.target === modal) closeModal();
            if (e.target === deleteModal) {
                deleteModal.classList.replace('flex', 'hidden');
                rowToDeleteNum = null;
            }
            if (e.target === infoModal) {
                infoModal.classList.replace('flex', 'hidden');
            }
        });

        document.getElementById("searchInput").addEventListener("keyup", function() {
            let input = this.value.toUpperCase();
            let tbody = document.getElementById("roomsBody");
            let tr = tbody.getElementsByTagName("tr");

            for (let i = 0; i < tr.length; i++) {
                let td = tr[i].getElementsByTagName("td")[0];
                if (td) {
                    let txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(input) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        });

        // Dropdowns Top Nav
        const profileBtn = document.getElementById('profile-btn');
        const profileDropdown = document.getElementById('profile-dropdown');
        const notiBtn = document.getElementById('noti-btn');
        const notiDropdown = document.getElementById('notifPopup');

        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            profileDropdown.classList.toggle('hidden');
            if (notiDropdown) notiDropdown.classList.add('hidden');
        });

        notiBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            notiDropdown.classList.toggle('hidden');
            if (profileDropdown) profileDropdown.classList.add('hidden');
        });

        document.addEventListener('click', (e) => {
            if (profileDropdown && !profileDropdown.classList.contains('hidden') && !profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
                profileDropdown.classList.add('hidden');
            }
            if (notiDropdown && !notiDropdown.classList.contains('hidden') && !notiBtn.contains(e.target) && !notiDropdown.contains(e.target)) {
                notiDropdown.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
