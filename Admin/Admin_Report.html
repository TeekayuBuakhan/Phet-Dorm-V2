        /* เพิ่ม transition ให้ดูนุ่มนวลเวลาชี้เมาส์ */
        .menu-item, .menu-active {
            transition: all 0.2s ease-in-out;
            border-radius: 0.5rem; /* กำหนดความโค้งมนให้เมนูทั้งหมด */

        /* สถานะ Hover: เมื่อเอาเมาส์ไปชี้ (พื้นหลังสีส้มอ่อน ตัวหนังสือและไอคอนสีส้มเข้ม) */

            background-color: rgba(211, 84, 0, 0.12); /* สีส้มอ่อนแบบโปร่งใสอิงจากโค้ดสี #D35400 */
            color: #D35400 !important;

    </style>

    <!-- Modal รายละเอียดแจ้งเหตุ -->
    <div id="repairPopup" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 animate-in fade-in duration-200">

            <!-- Header Modal -->
            <div class="px-8 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h2 class="text-xl font-bold text-gray-800">รายละเอียดการแจ้งเรื่อง</h2>
                <button onclick="closePopup()" class="text-gray-400 hover:text-gray-600 transition-colors focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>

            </div>

                    <div class="flex justify-between items-center mb-6">

                            <span class="text-xs text-gray-400 font-medium mb-1">วันที่แจ้ง</span>
                            <span id="popup-date" class="text-gray-700 font-bold">-</span>
                        </div>
                        <span id="popup-type" class="bg-orange-50 text-phet-orange border border-orange-200 px-4 py-1.5 rounded-full text-sm font-bold">ประเภท</span>
                    </div>

                    <div class="flex flex-col flex-1 min-h-[200px]">
                        <span class="text-sm font-medium text-gray-500 mb-2">รายละเอียด</span>
                        <div id="popup-detail" class="bg-gray-50 border border-gray-200 rounded-xl p-4 text-gray-700 text-sm flex-1 overflow-y-auto custom-scrollbar leading-relaxed">
                            -
                        </div>
                    </div>
                    
                    <!-- ปุ่ม Action -->
                    <div class="flex gap-3 mt-6 pt-6 border-t border-gray-100">
                        <button id="accept-btn" onclick="updateStatus('รับเรื่องแล้ว')" class="flex-1 bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2.5 rounded-xl font-medium hover:bg-blue-100 transition-all text-sm">
                            รับเรื่อง
                        </button>
                        <button id="finish-btn" onclick="updateStatus('เสร็จสิ้น')" class="flex-1 bg-btn-green text-white px-4 py-2.5 rounded-xl font-medium hover:bg-emerald-500 shadow-sm transition-all text-sm">
                            ดำเนินการเสร็จสิ้น
                        </button>
                    </div>
                </div>

                <!-- ขวา: รูปภาพ -->
                <div class="flex-1 flex flex-col">
                    <span class="text-sm font-medium text-gray-500 mb-2">รูปภาพประกอบ</span>
                    <div class="rounded-xl border border-dashed border-gray-300 h-full min-h-[300px] flex items-center justify-center bg-gray-50 overflow-hidden relative">
                        <div id="popup-img-container" class="w-full h-full overflow-y-auto custom-scrollbar p-3 flex-col gap-3 hidden">
                            <!-- JS จะใส่รูปที่นี่ -->
                        </div>
                        <p id="no-img-text" class="text-gray-400 text-sm absolute">ไม่มีรูปภาพประกอบ</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let repairData = [];
        let currentRepairId = null;

        function loadReports() {
            repairData = JSON.parse(localStorage.getItem('phetDromRepairData')) || [];
            renderTable();
        }

        function saveData() {
            localStorage.setItem('phetDromRepairData', JSON.stringify(repairData));
        }

        function renderTable() {
            const tbody = document.getElementById("notifBody");
            const searchInput = document.getElementById("searchInput").value.trim();
            tbody.innerHTML = ""; 

            const filteredData = repairData.filter(item => 
                searchInput === "" || "23A".includes(searchInput)
            );

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-gray-400 text-center">ไม่พบข้อมูลการแจ้งเรื่อง</td></tr>`;
                return;
            }

            filteredData.forEach((item) => {
                let statusText = item.status === 'ยังไม่ได้รับเรื่อง' ? "รอการตอบกลับ" : item.status;
                let statusClass = "bg-orange-50 text-orange-600 border-orange-200";

                if (item.status === 'เสร็จสิ้น') statusClass = "bg-green-50 text-green-700 border-green-200";
                else if (item.status === 'รับเรื่องแล้ว') statusClass = "bg-blue-50 text-blue-700 border-blue-200";

                const tr = document.createElement("tr");
                tr.className = "border-b border-gray-50 hover:bg-gray-50/50 transition-colors text-sm";
                tr.innerHTML = `
                    <td class="py-4 px-6 text-gray-600">${item.date}</td>
                    <td class="py-4 px-6 font-bold text-gray-800">23A</td> 
                    <td class="py-4 px-6 text-gray-600">${item.type}</td>
                    <td class="py-4 px-6">
                        <span onclick="openRepairPopup(${item.id})" 
                            class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-all hover:shadow-sm border ${statusClass}">
                            ${statusText}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openRepairPopup(id) {
            currentRepairId = id;
            const item = repairData.find(r => r.id === id);
            if (!item) return;

            document.getElementById("repairPopup").classList.remove("hidden");
            document.getElementById("popup-date").innerText = item.date;
            document.getElementById("popup-type").innerText = item.type;
            document.getElementById("popup-detail").innerText = item.detail;

            const imgContainer = document.getElementById("popup-img-container");
            const noImg = document.getElementById("no-img-text");
            
            imgContainer.innerHTML = "";
            const imagesToDisplay = item.images || (item.img ? [item.img] : []);

            if (imagesToDisplay.length > 0) {
                imgContainer.innerHTML = imagesToDisplay.map(src => `
                    <div class="w-full flex-shrink-0 rounded-xl overflow-hidden shadow-sm border border-gray-200 bg-white">
                        <img src="${src}" class="w-full h-auto object-cover cursor-pointer hover:opacity-90 transition-opacity" onclick="openImageViewer('${src}')" title="คลิกเพื่อดูรูปขนาดเต็ม">
                    </div>
                `).join('');
                
                imgContainer.classList.remove("hidden");
                imgContainer.classList.add("flex"); 
                noImg.classList.add("hidden");
            } else {
                imgContainer.classList.add("hidden"); 
                imgContainer.classList.remove("flex");
                noImg.classList.remove("hidden");
            }

            const btnAccept = document.getElementById("accept-btn");
            const btnFinish = document.getElementById("finish-btn");
            
            btnAccept.classList.toggle("hidden", item.status !== 'ยังไม่ได้รับเรื่อง');
            btnFinish.classList.toggle("hidden", item.status === 'เสร็จสิ้น');
        }

        function openImageViewer(src) {
            document.getElementById('image-viewer-img').src = src;
            document.getElementById('image-viewer').classList.remove('hidden');
        }

        function closeImageViewer() {
            document.getElementById('image-viewer').classList.add('hidden');
            setTimeout(() => { document.getElementById('image-viewer-img').src = ''; }, 200);
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeImageViewer();
            }
        });

        function updateStatus(newStatus) {
            const idx = repairData.findIndex(r => r.id === currentRepairId);
            if (idx !== -1) {
                repairData[idx].status = newStatus;
                repairData[idx].action = newStatus; 
                saveData();
                renderTable();
                closePopup();
            }
        }

        function closePopup() {
            document.getElementById("repairPopup").classList.add("hidden");
            currentRepairId = null;
        }

        // Header / Dropdown UI Interactions
        window.onload = () => {
            loadReports();
            
            const profileBtn = document.getElementById('profile-btn');
            const profileDropdown = document.getElementById('profile-dropdown');
            const notiBtn = document.getElementById('noti-btn');
            const notiDropdown = document.getElementById('notifPopup');

            profileBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                profileDropdown.classList.toggle('hidden');
                if (notiDropdown) notiDropdown.classList.add('hidden');
            });

            notiBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                notiDropdown.classList.toggle('hidden');
                if (profileDropdown) profileDropdown.classList.add('hidden');
            });

            document.addEventListener('click', (e) => {
                if (profileDropdown && !profileDropdown.classList.contains('hidden') && !profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
                    profileDropdown.classList.add('hidden');
                }
                if (notiDropdown && !notiDropdown.classList.contains('hidden') && !notiBtn.contains(e.target) && !notiDropdown.contains(e.target)) {
                    notiDropdown.classList.add('hidden');
                }
            });
        };

    </script>
</body>
</html>
