<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การจดบันทึกมิเตอร์ - หอพักเพชร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        'phet-bg': '#F3F4F6',
                        'sidebar-bg': '#FFFFFF',
                        'phet-orange': '#D35400',
                        'btn-green': '#34D399', 
                    },
                },
            },
        }

    <style>
        body { background-color: #F8F9FB; }
        
        /* เพิ่ม transition ให้ดูนุ่มนวลเวลาชี้เมาส์ */
        .menu-item, .menu-active {
            transition: all 0.2s ease-in-out;
            border-radius: 0.5rem; /* กำหนดความโค้งมนให้เมนูทั้งหมด */
        }

        /* สถานะ Hover: เมื่อเอาเมาส์ไปชี้ (พื้นหลังสีส้มอ่อน ตัวหนังสือและไอคอนสีส้มเข้ม) */
        .menu-item:hover {
            background-color: rgba(211, 84, 0, 0.12); /* สีส้มอ่อนแบบโปร่งใสอิงจากโค้ดสี #D35400 */
            color: #D35400 !important;
            font-weight: 500;
        }
        .menu-item:hover svg {
            color: #D35400 !important;
        }

        /* สถานะ Active: เมื่อหน้าเว็บนั้นถูกเปิดอยู่ (พื้นหลังสีส้มเข้ม ตัวหนังสือและไอคอนสีขาว) */
        .menu-active {
            background-color: #D35400; 
            color: #FFFFFF !important;
            font-weight: 500;
        }
        .menu-active svg {
            color: #FFFFFF !important;
        }
    </style>
</head>
<body class="text-gray-800 font-sans flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-sidebar-bg border-r border-gray-200 flex flex-col justify-between h-full py-6 px-4 shrink-0">
        <div>
            <!-- Logo -->
            <div class="flex items-center space-x-2 px-2 mb-10">
                <div class="w-8 h-8 rounded flex items-center justify-center text-phet-orange">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/><path d="M2 9h20"/><path d="M12 21V9"/><path d="M18 3l-6 6"/><path d="M6 3l6 6"/></svg>
                </div>
                <h1 class="text-xl font-bold tracking-wide text-phet-orange">หอพักเพชร</h1>
            </div>

            <!-- Navigation -->
            <nav class="space-y-1">
                <a href="Admin_main.html" class="menu-item flex items-center space-x-3 px-4 py-3 text-gray-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    <span>หน้าหลัก</span>
                </a>
                <a href="Admin_meter.html" class="menu-active flex items-center space-x-3 px-4 py-3 text-gray-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
                    <span>การจดบันทึกมิเตอร์</span>
                </a>
                <!-- เปลี่ยน class เป็น menu-active สำหรับหน้าการทำบิล -->

                </a>

    <!-- Main Content (พื้นที่เนื้อหาหลัก) -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <!-- Top Bar -->

            <!-- แจ้งเตือน -->
            <div class="relative">
                <button id="noti-btn" class="relative p-2.5 bg-white rounded-full shadow-sm hover:shadow transition border border-gray-100 text-gray-500">

                <div id="notifPopup" class="hidden absolute right-0 mt-3 w-80 z-50">
                    <div class="bg-white rounded-[20px] shadow-xl border border-gray-100 relative z-10 overflow-hidden">

                        <div class="flex flex-col overflow-y-auto max-h-[300px] custom-scrollbar">

                                <div class="flex-1">
                                    <p class="font-bold text-gray-800 text-sm">ห้อง 23A - เจษฎา พรมภิบาล</p>
                                    <div class="flex justify-between items-center mt-1">
                                        <span class="text-xs text-red-500 font-medium">แจ้งเหตุ</span>
                                        <span class="text-[10px] text-gray-400">15 ก.พ. 69</span>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Profile -->
            <div class="relative">
                <button id="profile-btn" class="flex items-center space-x-2 bg-white border border-gray-100 rounded-full px-4 py-2 shadow-sm hover:shadow transition">
                    <div class="w-6 h-6 bg-gray-200 rounded-full flex items-center justify-center overflow-hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" /></svg>
                    </div>
                    <span class="text-sm font-medium text-gray-700">ทีฆายุ</span>
                </button>
                <div id="profile-dropdown" class="hidden absolute right-0 mt-3 w-64 z-50">
                    <div class="bg-white rounded-[20px] shadow-xl border border-gray-100 overflow-hidden p-2">
                        <button onclick="window.location.href='Profile_Admin.html'" class="flex items-center space-x-3 w-full px-4 py-3 hover:bg-gray-50 rounded-xl transition-colors text-gray-700">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.89 1.147l-3.102.933a.675.675 0 01-.836-.836l.932-3.102a4.5 4.5 0 011.147-1.89L16.862 4.487zM16.862 4.487L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" /></svg>
                            <span class="font-medium text-sm">แก้ไขข้อมูลส่วนตัว</span>
                        </button>
                        <div class="h-px bg-gray-100 my-1 mx-2"></div>
                        <button onclick="window.location.href='../index.html'" class="flex items-center space-x-3 w-full px-4 py-3 hover:bg-gray-50 rounded-xl transition-colors text-red-500">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" /></svg>
                            <span class="font-medium text-sm">ออกจากระบบ</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="px-10 pb-10 max-w-6xl w-full mx-auto">
            
            <!-- Page Title -->
            <h2 class="text-3xl font-bold text-gray-800 mb-8">การจดบันทึกมิเตอร์</h2>

            <!-- Action Bar (ตัวกรอง และ ค้นหา) -->
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <!-- ฝั่งซ้าย: Dropdown วันที่ -->
                <div class="flex space-x-3">
                    <div class="relative bg-white border border-gray-300 rounded-xl px-4 py-2 flex items-center cursor-pointer shadow-sm min-w-[140px]">
                        <span class="text-gray-600 font-medium">เดือน เมษายน</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 ml-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </div>
                    <div class="relative bg-white border border-gray-300 rounded-xl px-4 py-2 flex items-center cursor-pointer shadow-sm min-w-[100px]">
                        <span class="text-gray-600 font-medium">2569</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 ml-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </div>
                    <button class="bg-phet-orange text-white px-6 py-2 rounded-xl font-medium hover:bg-orange-600 transition shadow-sm">
                        เลือก
                    </button>
                </div>

                <!-- ฝั่งขวา: ค้นหาห้อง -->
                <div class="flex space-x-3 w-full md:w-auto">
                    <div class="relative w-full md:w-64">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                        </div>
                        <input type="text" class="bg-white border border-gray-300 text-gray-700 text-sm rounded-full focus:ring-phet-orange focus:border-phet-orange block w-full pl-10 p-2.5 shadow-sm outline-none" placeholder="ค้นหาเลขห้อง">
                    </div>
                    <button class="bg-phet-orange text-white px-6 py-2 rounded-full font-medium hover:bg-orange-600 transition shadow-sm whitespace-nowrap">

                    </button>
                </div>
            </div>

            <!-- Table Container -->
            <div class="bg-white rounded-[20px] shadow-sm border border-gray-100 overflow-hidden">
                <table class="w-full text-center border-collapse">
                    <thead class="bg-gray-50/50 border-b border-gray-100 text-gray-700">
                        <tr>
                            <th class="py-5 px-6 font-medium w-[15%]">ห้อง</th>
                            <th class="py-5 px-6 font-medium w-[25%]">เลขมิเตอร์เดือนก่อนหน้า</th>
                            <th class="py-5 px-6 font-medium w-[25%]">เลขมิเตอร์เดือนนี้</th>
                            <th class="py-5 px-6 font-medium w-[15%]">หน่วยใช้</th>
                            <th class="py-5 px-6 font-medium w-[15%]">คิดเป็นเงิน</th>
                            <th class="py-5 px-6 font-medium w-[15%]"></th> <!-- ช่องว่างสำหรับปุ่ม -->
                        </tr>
                    </thead>
                    <tbody class="text-gray-600">
                        <!-- แถว 1 -->
                        <tr class="border-b border-gray-50 hover:bg-gray-50/30 transition-colors">
                            <td class="py-4 px-6 font-medium">23A</td>
                            <td class="py-4 px-6">0</td>
                            <td class="py-4 px-6">
                                <input type="text" class="meter-input" value="">
                            </td>
                            <td class="py-4 px-6 text-gray-400">0</td>
                            <td class="py-4 px-6 text-red-500 font-medium">0</td>
                            <td class="py-4 px-6 pr-8 text-right">
                                <button class="bg-btn-green text-white px-6 py-1.5 rounded-lg text-sm font-medium hover:bg-green-600 transition shadow-sm">
                                    บันทึก
                                </button>
                            </td>
                        </tr>
                        <!-- แถว 2 -->
                        <tr class="border-b border-gray-50 hover:bg-gray-50/30 transition-colors">
                            <td class="py-4 px-6 font-medium">12B</td>
                            <td class="py-4 px-6">0</td>
                            <td class="py-4 px-6">
                                <input type="text" class="meter-input" value="">
                            </td>
                            <td class="py-4 px-6 text-gray-400">0</td>
                            <td class="py-4 px-6 text-red-500 font-medium">0</td>
                            <td class="py-4 px-6 pr-8 text-right">
                                <button class="bg-btn-green text-white px-6 py-1.5 rounded-lg text-sm font-medium hover:bg-green-600 transition shadow-sm">
                                    บันทึก
                                </button>
                            </td>
                        </tr>
                        <!-- แถว 3 -->
                        <tr class="hover:bg-gray-50/30 transition-colors">
                            <td class="py-4 px-6 font-medium">67C</td>
                            <td class="py-4 px-6">0</td>
                            <td class="py-4 px-6">
                                <input type="text" class="meter-input" value="">
                            </td>
                            <td class="py-4 px-6 text-gray-400">0</td>
                            <td class="py-4 px-6 text-red-500 font-medium">0</td>
                            <td class="py-4 px-6 pr-8 text-right">
                                <button class="bg-btn-green text-white px-6 py-1.5 rounded-lg text-sm font-medium hover:bg-green-600 transition shadow-sm">
                                    บันทึก
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <script>
        // Dropdowns Top Nav
        const profileBtn = document.getElementById('profile-btn');
        const profileDropdown = document.getElementById('profile-dropdown');
        const notiBtn = document.getElementById('noti-btn');
        const notiDropdown = document.getElementById('notifPopup');

        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            profileDropdown.classList.toggle('hidden');
            if (notiDropdown) notiDropdown.classList.add('hidden');
        });

        notiBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            notiDropdown.classList.toggle('hidden');
            if (profileDropdown) profileDropdown.classList.add('hidden');
        });

        document.addEventListener('click', (e) => {
            if (profileDropdown && !profileDropdown.classList.contains('hidden') && !profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
                profileDropdown.classList.add('hidden');
            }
            if (notiDropdown && !notiDropdown.classList.contains('hidden') && !notiBtn.contains(e.target) && !notiDropdown.contains(e.target)) {
                notiDropdown.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
