    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        'phet-bg': '#F3F4F6',

    <style>
        body { background-color: #F8F9FB; }
        
        /* เพิ่ม transition ให้ดูนุ่มนวลเวลาชี้เมาส์ */
        .menu-item, .menu-active {
            transition: all 0.2s ease-in-out;
            border-radius: 0.5rem; /* กำหนดความโค้งมนให้เมนูทั้งหมด */
        }

        /* สถานะ Hover: เมื่อเอาเมาส์ไปชี้ (พื้นหลังสีส้มอ่อน ตัวหนังสือและไอคอนสีส้มเข้ม) */
        .menu-item:hover {
            background-color: rgba(211, 84, 0, 0.12); /* สีส้มอ่อนแบบโปร่งใสอิงจากโค้ดสี #D35400 */
            color: #D35400 !important;
            font-weight: 500;
        }
        .menu-item:hover svg {
            color: #D35400 !important;
        }

        /* สถานะ Active: เมื่อหน้าเว็บนั้นถูกเปิดอยู่ (พื้นหลังสีส้มเข้ม ตัวหนังสือและไอคอนสีขาว) */
        .menu-active {
            background-color: #D35400; 
            color: #FFFFFF !important;
            font-weight: 500;
        }
        .menu-active svg {
            color: #FFFFFF !important;
        }

        /* ช่องกรอกเลขมิเตอร์ปัจจุบัน: พื้นหลังสีส้มอ่อน + Hover */
        .meter-input {
            background-color: rgba(211, 84, 0, 0.08); /* สีส้มอ่อนโปร่งใส */
            border: 1px solid rgba(211, 84, 0, 0.25);
            border-radius: 0.5rem;
            width: 100px;
            padding: 0.5rem 0;
            text-align: center;
            font-weight: 500;
            font-size: 0.875rem;
            color: #D35400;
            outline: none;
            transition: all 0.2s ease-in-out;
        }
        .meter-input::placeholder {
            color: rgba(211, 84, 0, 0.45);
        }
        .meter-input:hover {
            background-color: rgba(211, 84, 0, 0.14);
            border-color: rgba(211, 84, 0, 0.5);
            box-shadow: 0 2px 6px rgba(211, 84, 0, 0.12);
        }
        .meter-input:focus {
            background-color: #FFFFFF;
            border-color: #D35400;
            box-shadow: 0 0 0 3px rgba(211, 84, 0, 0.15);
        }
    </style>
</head>

    <script>
        // Dropdowns Top Nav
        const profileBtn = document.getElementById('profile-btn');
        const profileDropdown = document.getElementById('profile-dropdown');
        const notiBtn = document.getElementById('noti-btn');
        const notiDropdown = document.getElementById('notifPopup');

        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            profileDropdown.classList.toggle('hidden');
            if (notiDropdown) notiDropdown.classList.add('hidden');
        });

        notiBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            notiDropdown.classList.toggle('hidden');
            if (profileDropdown) profileDropdown.classList.add('hidden');
        });

        document.addEventListener('click', (e) => {
            if (profileDropdown && !profileDropdown.classList.contains('hidden') && !profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
                profileDropdown.classList.add('hidden');
            }
            if (notiDropdown && !notiDropdown.classList.contains('hidden') && !notiBtn.contains(e.target) && !notiDropdown.contains(e.target)) {
                notiDropdown.classList.add('hidden');
            }
        });

        // Dropdown เดือน/ปี (Custom)
        function toggleSelMenu(menuId) {
            const menu = document.getElementById(menuId);
            const isHidden = menu.classList.contains('hidden');
            document.querySelectorAll('.sel-menu').forEach(m => m.classList.add('hidden'));
            if (isHidden) menu.classList.remove('hidden');
        }

        function setSelValue(type, value) {
            const sel = document.getElementById(type === 'month' ? 'monthSelect' : 'yearSelect');
            const opt = Array.from(sel.options).find(o => o.value === value);
            if (!opt) return;
            sel.value = value;
            document.getElementById(type + 'Label').innerText = opt.text;
            const menu = document.getElementById(type + 'Menu');
            menu.querySelectorAll('.sel-option').forEach(btn => {
                const selected = btn.dataset.value === value;
                btn.classList.toggle('bg-phet-orange/10', selected);
                btn.classList.toggle('text-phet-orange', selected);
                btn.querySelector('.sel-check').classList.toggle('hidden', !selected);
            });
            menu.classList.add('hidden');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.relative')) {
                document.querySelectorAll('.sel-menu').forEach(m => m.classList.add('hidden'));
            }
        });

        setSelValue('month', 'เมษายน');
        setSelValue('year', '2569');

        // จำกัดการกรอกเลขมิเตอร์: ตัวเลขเท่านั้น ไม่เกิน 4 หลัก
        document.querySelectorAll('.meter-input').forEach(inp => {
            inp.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
            });
        });
    </script>
