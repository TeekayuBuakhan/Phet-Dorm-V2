<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>หอพักเพชร-ห้องที่ว่าง</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        'phet-bg': '#F4F5F7',
                        'sidebar-bg': '#FFFFFF',
                        'phet-orange': '#D35400',
                        'btn-green': '#22C55E',
                    },
                },
            },
        }
    </script>
</head>
 
<body class="bg-[#F8F9FB] min-h-screen flex flex-col">
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <img src="../img/petch.logo.png" class="w-12 h-12">
            <div class="w-[4px] h-12 bg-[#D35400]"></div>
            <h1 class="text-3xl font-bold text-gray-800">ห้องที่ว่าง</h1>
        </div>
        <div class="flex space-x-4">
            <button onclick="gotoPage('../index.html')" class="bg-white border-2 border-[#D35400] text-[#D35400] px-4 py-1.5 rounded-full text-xl font-medium transition transform hover:scale-105 hover:bg-[#D35400] hover:text-white">
                กลับไปหน้าหลัก
             </button>
             <button onclick="openModal()" class="bg-white border-2 border-[#D35400] text-[#D35400] px-4 py-1.5 rounded-full text-xl font-medium transition transform hover:scale-105 hover:bg-[#D35400] hover:text-white">
                นัดจอง
            </button>
 
        </div>
    </header>
    <main class="flex-1 container mx-auto px-10 py-12">
        <div id="vacantRoomContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            </div>
    </main>
 
<script>
    // โหลดข้อมูลเมื่อเปิดหน้า
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('vacantRoomContainer');
        const roomsData = JSON.parse(localStorage.getItem('dormRoomsData')) || [];
        
        // กรองเฉพาะห้องที่ว่าง (ไม่มีผู้เช่า หรือผู้เช่าเป็น '-')
        const vacantRooms = roomsData.filter(room => !room.tenantName || room.tenantName.trim() === '' || room.tenantName === '-');

        if (vacantRooms.length === 0) {
            container.innerHTML = `<p class="col-span-full text-center text-2xl font-bold text-gray-800">ขณะนี้ยังไม่มีห้องว่างครับ</p>`;
            return;
        }

        // วนลูปสร้างการ์ดห้องว่าง
        vacantRooms.forEach(room => {
            // ดึงรูปภาพแรกจาก array images (ถ้ามี) ถ้าไม่มีให้ใช้รูป default
            const firstImage = (room.images && room.images.length > 0) ? room.images[0] : '../img/home.jpg';

            const card = document.createElement('div');
            card.className = "bg-white rounded-3xl shadow-xl overflow-hidden";
            card.innerHTML = `
                <div class="flex p-6 gap-6">
                    <img src="${firstImage}" class="w-28 h-28 rounded-xl object-cover">
                    <div class="space-y-2 text-lg">
                        <p><b>ห้อง :</b> ${room.roomNum}</p>
                        <p><b>ประเภท :</b> ${room.roomType || '-'}</p>
                        <p><b>ราคา :</b> ${room.price || '-'} บาท</p>
                    </div>
                </div>
                <div class="w-full bg-[#D35400] py-3 px-6 flex items-center justify-between">
                    <span class="text-white text-lg font-semibold">รายละเอียด</span>
                    <button onclick="gotoPage('Detail_vacant_room.html?room=${room.roomNum}')" class="text-white hover:scale-110 transition">
                        <svg width="12" height="21" viewBox="0 0 12 21" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1.5 19.5L10.5 10.5L1.5 1.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    });

    function gotoPage(page){
        window.location.href = page;
    }
 
    function openModal(){
        document.getElementById("contactModal").classList.remove("hidden");
    }
 
    function closeModal(){
        document.getElementById("contactModal").classList.add("hidden");
    }
</script>
 
    <div id="contactModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-3xl shadow-2xl p-10 w-[90%] max-w-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black text-2xl">✕</button>
            <h2 class="text-3xl font-bold text-center mb-8">ติดต่อ</h2>
            <div class="flex flex-col md:flex-row items-center justify-center gap-10 w-full">
                <img src="../img/qr.png" class="w-56 h-56 object-contain md:w-64">
                <div class="text-center md:text-left space-y-4 flex flex-col items-center md:items-start">
                    <a href="../img/qr.png" download class="bg-[#D35400] text-white px-6 py-3 rounded-full shadow hover:scale-105 transition inline-block md:mr-6">
                        ⬇ บันทึก QR code
                    </a>
                    <p class="text-gray-500 md:ml-12">หรือโทร</p>
                    <p class="text-[#D35400] text-xl font-semibold md:ml-2">066-089-0158</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
