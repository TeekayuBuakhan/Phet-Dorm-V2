<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>ผู้เช่า - แจ้งเหตุ</title>
  <script src="https://cdn.tailwindcss.com"></script>
   <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        'phet-bg': '#F4F5F7',
                        'sidebar-bg': '#FFFFFF',
                        'phet-orange': '#D35400',
                        'btn-green': '#22C55E',
                    },
                },
            },
        }
    </script>
    <style>
        .tab-active { background-color: #FFFFFF; border-radius: 16px 16px 0 0; text-shadow: 0px 2px 4px rgba(0,0,0,0.15); box-shadow: 0 -4px 10px -4px rgba(0,0,0,0.05); }
        #slide-indicator { position: absolute; bottom: 0; height: 40px; background-color: #FFFFFF; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 10px -4px rgba(0,0,0,0.05); z-index: 10; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-slide { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .text-active { font-weight: bold !important; color: #D35400 !important; text-shadow: 0px 2px 4px rgba(0,0,0,0.15) !important; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.3); backdrop-filter: blur(2px); transition: all 0.3s ease; }
        .modal-enter { transform: scale(0.9); opacity: 0; }
        .modal-show { transform: scale(1); opacity: 1; }
        
        /* สไตล์สำหรับ Scrollbar ในกล่องรูปภาพให้อยู่ในกรอบสวยงาม */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #E5E7EB; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #D1D5DB; }
    </style>
</head>
<body class="bg-phet-bg min-h-screen text-gray-800 font-sans">

    <div id="custom-alert" class="hidden fixed inset-0 z-[100] flex items-center justify-center modal-overlay" onclick="closeAlert()">
        <div class="bg-white rounded-[40px] p-10 flex flex-col items-center space-y-6 shadow-2xl max-w-xs w-full mx-4 transition-all duration-300 modal-enter" id="alert-box">
            <div class="w-24 h-24 rounded-full border-[6px] border-red-500 flex items-center justify-center">
                <span class="text-red-500 text-6xl font-bold">!</span>
            </div>
            <p class="text-phet-orange text-3xl font-bold text-center leading-tight">กรุณากรอกข้อมูล<br>ให้ครบ</p>
        </div>
    </div>

    <div id="image-viewer" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity" onclick="closeImageViewer()">
        <img id="image-viewer-img" src="" class="max-w-[90%] max-h-[90%] object-contain rounded-lg shadow-2xl" onclick="event.stopPropagation()">
        <button onclick="closeImageViewer()" class="absolute top-6 right-6 text-white text-5xl font-bold hover:text-phet-orange transition-colors focus:outline-none">&times;</button>
    </div>

    <header class="bg-white border-b border-gray-200 flex justify-between items-center px-8 h-16 shadow-md relative z-30">
    <div class="w-1/3 flex justify-start">
        <button onclick="gotoPage('Main_Tenant.html')" class="flex items-center space-x-3 w-fit p-1 rounded-lg transition-all duration-200 focus:outline-none hover:bg-white/20">
            <div class="w-8 h-8 rounded flex items-center justify-center text-phet-orange">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/><path d="M2 9h20"/><path d="M12 21V9"/><path d="M18 3l-6 6"/><path d="M6 3l6 6"/></svg>
            </div>
            <div class="w-[3px] h-6 bg-phet-orange"></div> 
            <h1 class="text-xl font-bold tracking-wide text-phet-orange">หอพักเพชร</h1>
        </button>
    </div>

    <nav id="main-nav" class="relative flex h-full items-end justify-center space-x-1 w-1/3"> 
        <div id="slide-indicator"></div>
        <button data-href="Main_Tenant.html" class="nav-btn px-6 pt-2 pb-2.5 text-[15px] font-medium text-gray-700 hover:text-phet-orange transition relative z-20">หน้าหลัก</button>
        <button data-href="Bill.html" class="nav-btn px-6 pt-2 pb-2.5 text-[15px] font-medium text-gray-700 hover:text-phet-orange transition relative z-20">ค่าเช่า</button>
        <button data-href="Repair.html" class="nav-btn px-6 pt-2 pb-2.5 text-[15px] font-medium text-gray-700 hover:text-phet-orange transition relative z-20">แจ้งเหตุ</button>
    </nav>

    <div class="flex items-center justify-end w-1/3 space-x-4">
        <div class="relative">
            <button id="noti-btn" class="relative p-2 bg-white border border-gray-200 rounded-full text-gray-500 shadow-sm hover:shadow-md hover:text-phet-orange transition-all duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
            </button>
            <div id="noti-dropdown" class="hidden absolute -right-6 mt-3 w-80 z-50">
                    <div class="absolute -top-2 right-[34px] w-5 h-5 bg-[#F3F4F6] transform rotate-45 rounded-sm"></div>
                    <div class="bg-[#F3F4F6] rounded-[24px] p-2.5 shadow-xl relative z-10">
                        <div class="bg-white rounded-[16px] flex flex-col overflow-hidden">
                            <div class="p-4 border-b text-center font-bold text-gray-700">แจ้งเตือน</div>
                            <button class="flex items-stretch text-left hover:bg-[#F5F5F5] p-4 group border-b last:border-0 transition-colors">
                                <div class="w-2 bg-phet-orange mr-3"></div>
                                <div>
                                    <p class="font-medium group-hover:text-phet-orange transition-colors">จอมมารตาก</p>
                                    <p class="text-xs text-gray-400">2 - พ.ค. - 2569</p>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        <div class="relative">
            <button id="profile-btn" class="flex items-center space-x-2 bg-white border border-gray-200 rounded-full px-4 py-1.5 text-gray-600 shadow-sm hover:shadow-md hover:text-phet-orange hover:border-phet-orange transition-all duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                <span class="text-sm font-medium">เจษฎา</span>
            </button>
            <div id="profile-dropdown" class="hidden absolute right-0 mt-3 w-72 z-50">
                <div class="absolute -top-2 right-8 w-5 h-5 bg-[#F3F4F6] transform rotate-45 rounded-sm"></div>
                <div class="bg-[#F3F4F6] rounded-[24px] p-2.5 shadow-[0_10px_25px_rgba(0,0,0,0.15)] relative z-10">
                    <div class="bg-white rounded-[16px] flex flex-col px-1 py-1">
                        <button onclick="window.location.href='Profile.html'" class="flex items-center justify-between px-4 py-3.5 hover:bg-[#F5F5F5] rounded-xl transition-colors group">
                            <div class="flex items-center space-x-3 text-phet-orange">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.89 1.147l-3.102.933a.675.675 0 01-.836-.836l.932-3.102a4.5 4.5 0 011.147-1.89L16.862 4.487zM16.862 4.487L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" /></svg>
                                <span class="font-medium text-[16px]">แก้ไขข้อมูลส่วนตัว</span>
                            </div>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-phet-orange group-hover:translate-x-1 transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" /></svg>
                        </button>
                        <div class="h-[1px] bg-[#E5E7EB] mx-4 my-0.5 opacity-60"></div>
                        <button onclick="window.location.href='../index.html'" class="flex items-center justify-between px-4 py-3.5 hover:bg-[#F5F5F5] rounded-xl transition-colors group">
                            <div class="flex items-center space-x-3 text-phet-orange">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" /></svg>
                                <span class="font-medium text-[16px]">ออกจากระบบ</span>
                            </div>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-phet-orange group-hover:translate-x-1 transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" /></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

    <main class="max-w-5xl mx-auto px-6 py-10 relative z-0">
        <div class="bg-phet-orange rounded-[40px] p-10 shadow-lg text-white">
            <div class="flex justify-between items-start mb-10">
                <div class="flex items-start space-x-6">
                    <div class=" rounded-2xl p-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    </div>
                    <div>
                        <h2 class="text-4xl font-bold tracking-tight">ห้อง : <span class="display-room ml-2">-</span></h2>
                        <p class="text-2xl font-medium opacity-90 mt-1">ชื่อผู้เช่า : <span class="display-name ml-2">-</span></p>
                    </div>
                </div>
                <div id="action-btn-placeholder"></div>
            </div>

            <div id="main-content-display" class="bg-white rounded-[45px] p-10 min-h-[450px]"></div>
        </div>
    </main>

    <script>
        // โหลดข้อมูลจาก Local Storage
        let repairData = JSON.parse(localStorage.getItem('phetDromRepairData')) || [];
        
        // ตัวแปรสำหรับเก็บรูปภาพที่เตรียมอัปโหลดหลายรูป
        let currentUploadedImages = [];

        function getThaiDate() {
            const now = new Date();
            const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            return `${now.getDate()} ${thaiMonths[now.getMonth()]} ${(now.getFullYear() + 543).toString().slice(-2)}`;
        }

        function gotoPage(page) {
            const indicator = document.getElementById("slide-indicator");
            const active = document.querySelector(".text-active"); 

            if (active) {
                sessionStorage.setItem('navLeft', active.offsetLeft);
                sessionStorage.setItem('navWidth', active.offsetWidth);
            }
            setTimeout(() => { 
            window.location.href = page; 
            }, 100); 
        }

        function renderFormView() {
            currentUploadedImages = []; 
            
            document.getElementById('action-btn-placeholder').innerHTML = `
                <button onclick="submitRepair()" class="group flex items-center space-x-3 bg-white text-phet-orange hover:bg-orange-50 px-8 py-3 rounded-2xl text-3xl font-bold shadow-md hover:shadow-xl active:scale-95 transition-all duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                    <span>ส่งคำร้อง</span>
                </button>`;
            
            document.getElementById('main-content-display').innerHTML = `
                <div class="flex gap-10 h-full animate-slide">
                    <div class="w-1/2 flex flex-col space-y-6">
                        <select id="f-type" class="w-full border-2 border-orange-200 rounded-2xl px-6 py-3 text-phet-orange text-xl focus:outline-none"><option value="" disabled selected>ประเภทเรื่องที่แจ้ง</option><option value="ทั่วไป">ทั่วไป</option><option value="แจ้งซ่อม">แจ้งซ่อม</option></select>
                        <textarea id="f-detail" placeholder="รายละเอียด" class="w-full flex-grow border-2 border-orange-200 rounded-[30px] p-6 text-xl text-gray-700 focus:outline-none resize-none min-h-[220px]"></textarea>
                        <div class="flex items-center">
                            <input type="file" id="f-img" class="hidden" multiple accept="image/*" onchange="previewImages(this)">
                            <label for="f-img" class="border-2 border-orange-200 text-phet-orange px-6 py-2 rounded-2xl cursor-pointer hover:bg-orange-50 transition-colors">แนบรูปภาพ</label>
                            <button onclick="renderListView()" class="ml-auto text-gray-400 underline hover:text-gray-600 transition-colors">ยกเลิก</button>
                        </div>
                    </div>
                    <div class="w-1/2 border-4 border-dashed border-orange-100 rounded-[45px] bg-gray-50 h-[380px] p-2 overflow-hidden">
                        <div id="p-box" class="w-full h-full overflow-y-auto custom-scrollbar px-4 pb-4 pt-2 flex flex-col gap-6">
                            <div class="w-full h-full flex items-center justify-center flex-col text-orange-200 min-h-[250px] my-auto">
                                <p class="text-3xl font-medium text-center mb-2">รูปที่แนบ</p>
                                <p class="text-xl text-center">จะแสดงที่นี่</p>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function renderDetailView(id) {
            const item = repairData.find(r => r.id === id); 
            document.getElementById('action-btn-placeholder').innerHTML = `<button onclick="renderListView()" class="bg-white text-phet-orange hover:bg-orange-50 px-10 py-3 rounded-2xl text-3xl font-bold shadow-md transition-all hover:shadow-lg">ย้อนกลับ</button>`;
            
            const imagesToDisplay = item.images || (item.img ? [item.img] : []);
            
            let imagesHtml = '';
            if (imagesToDisplay.length > 0) {
                // ปรับรูปให้เรียงเป็นแนวตั้ง (1 แถวต่อ 1 รูป) ขยายเต็มกรอบ
                imagesHtml = imagesToDisplay.map(src => `
                    <div class="relative w-full aspect-[4/3] flex-shrink-0 rounded-2xl overflow-hidden shadow-sm border border-gray-200">
                        <img src="${src}" class="w-full h-full object-cover cursor-pointer hover:scale-105 transition-transform duration-300" onclick="openImageViewer('${src}')" title="คลิกเพื่อดูรูปขนาดเต็ม">
                    </div>
                `).join('');
            } else {
                imagesHtml = `<div class="w-full h-full flex items-center justify-center min-h-[250px] my-auto"><p class="text-orange-200 text-2xl">ไม่มีรูปภาพประกอบ</p></div>`;
            }

            document.getElementById('main-content-display').innerHTML = `
                <div class="flex gap-10 h-full animate-slide">
                    <div class="w-1/2 flex flex-col space-y-6">
                        <div class="w-full border-2 border-orange-100 rounded-2xl px-6 py-3 text-phet-orange text-xl bg-gray-50 font-medium">ประเภท: <span class="text-gray-700">${item.type}</span></div>
                        <div class="w-full flex-grow border-2 border-orange-100 rounded-[30px] p-6 text-xl text-gray-600 bg-gray-50 min-h-[220px] whitespace-pre-wrap">${item.detail}</div>
                        <div class="text-gray-400 text-sm bg-gray-50 p-4 rounded-xl">แจ้งเมื่อ: ${item.date} <br>สถานะ: <span class="font-bold text-phet-orange">${item.status}</span></div>
                    </div>
                    <div class="w-1/2 border-4 border-dashed border-orange-100 rounded-[45px] bg-gray-50 h-[380px] p-2 overflow-hidden">
                        <div class="w-full h-full overflow-y-auto custom-scrollbar px-4 pb-4 pt-2 flex flex-col gap-6">
                            ${imagesHtml}
                        </div>
                    </div>
                </div>`;
        }

        // --- ระบบจัดการรูปภาพ ---
        function previewImages(input) {
            if (input.files) {
                Array.from(input.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = e => {
                        currentUploadedImages.push(e.target.result);
                        updatePreviewBox();
                    };
                    reader.readAsDataURL(file);
                });
                input.value = ''; 
            }
        }

        function updatePreviewBox() {
            const pBox = document.getElementById('p-box');
            if (currentUploadedImages.length === 0) {
                pBox.innerHTML = `
                    <div class="w-full h-full flex items-center justify-center flex-col text-orange-200 min-h-[250px] my-auto">
                        <p class="text-3xl font-medium text-center mb-2">รูปที่แนบ</p>
                        <p class="text-xl text-center">จะแสดงที่นี่</p>
                    </div>`;
                return;
            }

            // แสดงภาพเรียงต่อกันเป็นแนวตั้งและขยายเต็มกรอบ
            pBox.innerHTML = currentUploadedImages.map((src, index) => `
                <div class="relative w-full aspect-[4/3] flex-shrink-0 rounded-2xl overflow-hidden shadow-md group border border-gray-200">
                    <img src="${src}" class="w-full h-full object-cover cursor-pointer hover:scale-105 transition-transform duration-300" onclick="openImageViewer('${src}')" title="คลิกเพื่อดูรูปขนาดเต็ม">
                    <button onclick="removeImage(${index})" class="absolute top-3 right-3 bg-red-500 hover:bg-red-600 text-white rounded-full w-9 h-9 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-sm shadow-md" title="ลบรูปนี้">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
            `).join('');
        }

        function removeImage(index) {
            currentUploadedImages.splice(index, 1);
            updatePreviewBox();
        }

        // --- ระบบโปรแกรมดูรูป (Image Viewer) ---
        function openImageViewer(src) {
            document.getElementById('image-viewer-img').src = src;
            document.getElementById('image-viewer').classList.remove('hidden');
        }

        function closeImageViewer() {
            document.getElementById('image-viewer').classList.add('hidden');
            setTimeout(() => { document.getElementById('image-viewer-img').src = ''; }, 300);
        }

        // --- ระบบแสดงผลหลัก ---
        function showAlert() {
            const modal = document.getElementById('custom-alert');
            const box = document.getElementById('alert-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('modal-enter'); box.classList.add('modal-show'); }, 10);
            setTimeout(closeAlert, 3000);
        }
        function closeAlert() {
            const modal = document.getElementById('custom-alert');
            const box = document.getElementById('alert-box');
            box.classList.remove('modal-show'); box.classList.add('modal-enter');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function renderListView() {
            document.getElementById('action-btn-placeholder').innerHTML = `
                <button onclick="renderFormView()" class="group flex items-center space-x-2 bg-white text-phet-orange hover:bg-orange-50 px-8 py-3 rounded-2xl text-3xl font-bold shadow-md hover:shadow-xl active:scale-95 transition-all duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 transform group-hover:rotate-90 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                    </svg>
                    <span>แจ้งเหตุ</span>
                </button>`;
            document.getElementById('main-content-display').innerHTML = `
                <div class="max-h-[380px] overflow-y-auto custom-scrollbar pr-2">
                    <table class="w-full text-center border-collapse">
                        <thead class="sticky top-0 bg-white z-10">
                            <tr class="text-gray-800 text-2xl font-semibold border-b-2 border-gray-100">
                                <th class="pb-6 pt-2">วันที่แจ้ง</th>
                                <th class="pb-6 pt-2">ประเภท</th>
                                <th class="pb-6 pt-2">สถานะ</th>
                                <th class="pb-6 pt-2">การดำเนินการ</th>
                                <th class="pb-6 pt-2"></th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-700 text-xl font-medium">
                            ${repairData.length === 0 ? `<tr><td colspan="5" class="py-10 text-gray-400">ยังไม่มีประวัติการแจ้งเหตุ</td></tr>` : 
                            repairData.map(item => `
                                <tr class="border-b border-gray-50 hover:bg-orange-50/30 transition-colors">
                                    <td class="py-6">${item.date}</td>
                                    <td class="py-6 text-gray-500">${item.type}</td>
                                    <td class="py-6">
                                        <span class="${item.status === 'เสร็จสิ้น' ? 'text-green-600' : item.status === 'รับเรื่องแล้ว' ? 'text-yellow-600' : 'text-gray-700'}">
                                            ${item.status}
                                        </span>
                                    </td>
                                    <td class="py-6">${item.action}</td>
                                    <td class="py-6 flex justify-center space-x-3">
                                        <button onclick="renderDetailView(${item.id})" class="bg-phet-orange text-white px-5 py-2 rounded-xl text-lg hover:scale-105 transition-all shadow-sm">รายละเอียด</button>
                                        ${item.status === 'ยังไม่ได้รับเรื่อง' ? `
                                            <button onclick="cancelRepair(${item.id})" class="bg-red-500 text-white px-5 py-2 rounded-xl text-lg hover:scale-105 hover:bg-red-600 transition-all shadow-sm">
                                                ยกเลิก
                                            </button>
                                        ` : ''}
                                    </td>
                                </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;
        }

        function cancelRepair(id) {
            if(confirm("คุณแน่ใจหรือไม่ว่าต้องการยกเลิกคำร้องนี้?")) {
                repairData = repairData.filter(item => item.id !== id);
                localStorage.setItem('phetDromRepairData', JSON.stringify(repairData));
                renderListView();
            }
        }

        function submitRepair() {
            const t = document.getElementById('f-type').value;
            const d = document.getElementById('f-detail').value;
            
            if(!t || !d) { showAlert(); return; }
            
            const imagesToSave = [...currentUploadedImages];
            
            repairData.unshift({ 
                date: getThaiDate(), 
                type: t, 
                status: 'ยังไม่ได้รับเรื่อง', 
                action: '-', 
                detail: d, 
                images: imagesToSave, 
                id: Date.now() 
            });
            
            localStorage.setItem('phetDromRepairData', JSON.stringify(repairData));
            
            currentUploadedImages = [];
            
            renderListView();
        }

        // --- Core Systems (Navigation & Dropdowns) ---
        window.onload = () => {
            const navLinks = document.querySelectorAll("#main-nav .nav-btn");
            const indicator = document.getElementById("slide-indicator");
            const notiBtn = document.getElementById('noti-btn');
            const notiDropdown = document.getElementById('noti-dropdown');
            const profileBtn = document.getElementById('profile-btn');
            const profileDropdown = document.getElementById('profile-dropdown');

            notiBtn.onclick = (e) => { e.stopPropagation(); notiDropdown.classList.toggle('hidden'); profileDropdown.classList.add('hidden'); };
            profileBtn.onclick = (e) => { e.stopPropagation(); profileDropdown.classList.toggle('hidden'); notiDropdown.classList.add('hidden'); };
            window.onclick = () => { notiDropdown.classList.add('hidden'); profileDropdown.classList.add('hidden'); };

            document.addEventListener('keydown', function(event) {
                if (event.key === "Escape") {
                    closeImageViewer();
                }
            });

            function moveIndicator(element) {
                navLinks.forEach(btn => btn.classList.remove("text-active"));
                element.classList.add("text-active");
                indicator.style.width = `${element.offsetWidth}px`;
                indicator.style.left = `${element.offsetLeft}px`;
                indicator.style.opacity = "1";
            }

            const activeLink = Array.from(navLinks).find(l => l.getAttribute("data-href") === "Repair.html") || navLinks[3];
            moveIndicator(activeLink);
            setTimeout(() => indicator.classList.add("animate-slide"), 50);

            navLinks.forEach(link => {
                link.addEventListener("click", function() {
                    moveIndicator(this);
                    if (this.getAttribute("data-href") !== "Repair.html") {
                        setTimeout(() => window.location.href = this.getAttribute("data-href"), 250);
                    } else { renderListView(); }
                });
            });

            renderListView();
        };

        function loadTenantData() {
            const roomsData = JSON.parse(localStorage.getItem('dormRoomsData')) || [];
            const myRoom = roomsData.find(room => room.tenantName && room.tenantName.includes("เจษฎา"));

            if (myRoom) {
                document.querySelectorAll('.display-room').forEach(el => el.innerText = myRoom.roomNum);
                document.querySelectorAll('.display-name').forEach(el => el.innerText = myRoom.tenantName);
            } else {
                document.querySelectorAll('.display-room').forEach(el => el.innerText = "ไม่มีห้อง");
                document.querySelectorAll('.display-name').forEach(el => el.innerText = "เจษฎา พรมภิบาล");
            }
        }

        loadTenantData();
    </script>
</body>
</html>
