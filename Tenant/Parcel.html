<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>ผู้เช่า - พัสดุ</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        'phet-blue': '#B3D8E8',
                        'phet-bg': '#FEFCE8',
                        'phet-orange': '#D35400',
                        'btn-orange': '#FF6530',
                        'btn-green': '#1ABC9C',
                        'btn-yellow': '#FEE101',
                    },
                },
            },
        }
    </script>
    <style>
        .tab-active {
            background-color: #FEFCE8; 
            border-radius: 16px 16px 0 0; 
            text-shadow: 0px 2px 4px rgba(0,0,0,0.15); 
            box-shadow: 0 -4px 10px -4px rgba(0,0,0,0.05); 
        }
        #slide-indicator {
            position: absolute;
            bottom: 0;
            height: 40px; 
            background-color: #FEFCE8; 
            border-radius: 16px 16px 0 0; 
            box-shadow: 0 -4px 10px -4px rgba(0,0,0,0.05); 
            z-index: 10;
        }
        .animate-slide {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .text-active {
            font-weight: bold !important;
            color: #D35400 !important;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.15) !important;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #9b9b9b;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #b34000;
        }
    </style>
</head>
<body class="bg-phet-bg min-h-screen text-gray-800">

    <header class="bg-phet-blue flex justify-between items-center px-8 h-16 shadow-md relative z-30">
    <div class="w-1/3 flex justify-start">
        <button onclick="window.location.href='Main_Tenant.html'" ...>

        <button onclick="gotoPage('Main_Tenant.html')" class="flex items-center space-x-3 w-fit p-1 rounded-lg transition-all duration-200 focus:outline-none hover:bg-white/20">
            <img src="../img/petch.logo.png" alt="หอพักเพชร" class="w-8 h-8"> 
            <div class="w-[3px] h-6 bg-phet-orange"></div> 
            <h1 class="text-xl font-bold tracking-wide">หอพักเพชร</h1>
        </button>
    </div>

    <nav id="main-nav" class="relative flex h-full items-end justify-center space-x-1 w-1/3"> 
        <div id="slide-indicator"></div>
        <button data-href="Main_Tenant.html" class="nav-btn px-6 pt-2 pb-2.5 text-[15px] font-medium text-gray-700 hover:text-phet-orange transition relative z-20">หน้าหลัก</button>
        <button data-href="Bill.html" class="nav-btn px-6 pt-2 pb-2.5 text-[15px] font-medium text-gray-700 hover:text-phet-orange transition relative z-20">ค่าเช่า</button>
        <button data-href="Parcel.html" class="nav-btn px-6 pt-2 pb-2.5 text-[15px] font-medium text-gray-700 hover:text-phet-orange transition relative z-20">พัสดุ</button>
        <button data-href="Repair.html" class="nav-btn px-6 pt-2 pb-2.5 text-[15px] font-medium text-gray-700 hover:text-phet-orange transition relative z-20">แจ้งเหตุ</button>
    </nav>

    <div class="flex items-center justify-end w-1/3 space-x-4">
        <div class="relative">
            <button id="noti-btn" class="relative p-2 bg-white border border-gray-200 rounded-full text-gray-500 shadow-sm hover:shadow-md hover:text-phet-orange transition-all duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
            </button>
            <div id="noti-dropdown" class="hidden absolute -right-6 mt-3 w-80 z-50">
                    <div class="absolute -top-2 right-[34px] w-5 h-5 bg-[#FCD8C4] transform rotate-45 rounded-sm"></div>
                    <div class="bg-[#FCD8C4] rounded-[24px] p-2.5 shadow-xl relative z-10">
                        <div class="bg-white rounded-[16px] flex flex-col overflow-hidden">
                            <div class="p-4 border-b text-center font-bold text-gray-700">แจ้งเตือน</div>
                            <button class="flex items-stretch text-left hover:bg-[#FEFCE8] p-4 group border-b last:border-0 transition-colors">
                                <div class="w-2 bg-phet-orange mr-3"></div>
                                <div>
                                    <p class="font-medium group-hover:text-phet-orange transition-colors">จอมมารตาก</p>
                                    <p class="text-xs text-gray-400">2 - พ.ค. - 2569</p>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        <div class="relative">
            <button id="profile-btn" class="flex items-center space-x-2 bg-white border border-gray-200 rounded-full px-4 py-1.5 text-gray-600 shadow-sm hover:shadow-md hover:text-phet-orange hover:border-phet-orange transition-all duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                <span class="text-sm font-medium">เจษฎา</span>
            </button>
            <div id="profile-dropdown" class="hidden absolute right-0 mt-3 w-72 z-50">
                <div class="absolute -top-2 right-8 w-5 h-5 bg-[#FCD8C4] transform rotate-45 rounded-sm"></div>
                <div class="bg-[#FCD8C4] rounded-[24px] p-2.5 shadow-[0_10px_25px_rgba(0,0,0,0.15)] relative z-10">
                    <div class="bg-white rounded-[16px] flex flex-col px-1 py-1">
                        <button onclick="window.location.href='Profile.html'" class="flex items-center justify-between px-4 py-3.5 hover:bg-[#FEFCE8] rounded-xl transition-colors group">
                            <div class="flex items-center space-x-3 text-phet-orange">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.89 1.147l-3.102.933a.675.675 0 01-.836-.836l.932-3.102a4.5 4.5 0 011.147-1.89L16.862 4.487zM16.862 4.487L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" /></svg>
                                <span class="font-medium text-[16px]">แก้ไขข้อมูลส่วนตัว</span>
                            </div>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-phet-orange group-hover:translate-x-1 transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" /></svg>
                        </button>
                        <div class="h-[1px] bg-[#FCD8C4] mx-4 my-0.5 opacity-60"></div>
                        <button onclick="window.location.href='../index.html'" class="flex items-center justify-between px-4 py-3.5 hover:bg-[#FEFCE8] rounded-xl transition-colors group">
                            <div class="flex items-center space-x-3 text-phet-orange">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" /></svg>
                                <span class="font-medium text-[16px]">ออกจากระบบ</span>
                            </div>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-phet-orange group-hover:translate-x-1 transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" /></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

    <main class="max-w-5xl mx-auto px-6 py-10 relative z-0">
    <div class="bg-phet-orange rounded-[40px] p-10 shadow-lg text-white">
        
        <div class="flex items-start space-x-6 mb-10">
            <div class=" rounded-2xl p-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
            </div>
            <div class="space-y-1">
                <div class="flex items-baseline space-x-4">
                    <span class="text-3xl font-medium">ห้อง :</span>
                    <span class="text-5xl font-bold display-room">-</span>
                </div>
                <div class="flex items-baseline space-x-4">
                    <span class="text-2xl font-medium">ชื่อผู้เช่า :</span>
                    <span class="text-3xl display-name">-</span>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[35px] overflow-hidden h-[520px] shadow-sm relative">
            <div class="h-full overflow-y-auto custom-scrollbar px-8 pb-8">
                <table class="w-full text-center border-separate border-spacing-0">
                    <thead class="sticky top-0 z-20">
                        <tr class="text-phet-orange text-2xl font-semibold">
                            <th class="bg-white py-6 uppercase border-b-2 border-orange-100">วันที่</th>
                            <th class="bg-white py-6 uppercase border-b-2 border-orange-100">เดือน</th>
                            <th class="bg-white py-6 uppercase border-b-2 border-orange-100">ปี พ.ศ.</th>
                            <th class="bg-white py-6 border-b-2 border-orange-100"></th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-700 text-xl">
                </tbody>
                </table>
            </div>
        </div>
</main>

    <script>
    const profileBtn = document.getElementById('profile-btn');
    const profileDropdown = document.getElementById('profile-dropdown');
    const notiBtn = document.getElementById('noti-btn');
    const notiDropdown = document.getElementById('noti-dropdown');

    if (notiBtn && notiDropdown) {
        notiBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            notiDropdown.classList.toggle('hidden'); 
            if(profileDropdown) profileDropdown.classList.add('hidden'); 
        });
    }

    if (profileBtn && profileDropdown) {
        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            profileDropdown.classList.toggle('hidden');
            if(notiDropdown) notiDropdown.classList.add('hidden'); 
        });
    }

    window.addEventListener('click', (e) => {
        if (notiDropdown && !notiDropdown.contains(e.target) && !notiBtn.contains(e.target)) {
            notiDropdown.classList.add('hidden');
        }
        if (profileDropdown && !profileDropdown.contains(e.target) && !profileBtn.contains(e.target)) {
            profileDropdown.classList.add('hidden');
        }
    });

    function renderParcelTable() {
        const tbody = document.querySelector("tbody");
        if (!tbody) return;

        const myRoomNum = document.querySelector('.display-room').innerText;
        
        const allParcels = JSON.parse(localStorage.getItem('parcelNotifications')) || [];
        
        const myParcels = allParcels.filter(p => p.room === myRoomNum).sort((a, b) => b.id - a.id);

        tbody.innerHTML = '';

        if (myParcels.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="py-20 text-gray-400 text-center text-xl">ไม่มีรายการพัสดุในขณะนี้</td></tr>';
            return;
        }

        myParcels.forEach(parcel => {
            const dateObj = new Date(parcel.id);
            const day = dateObj.getDate();
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const month = monthNames[dateObj.getMonth()];
            const year = dateObj.getFullYear() + 543;

            const tr = document.createElement('tr');
            tr.className = 'border-b border-gray-50 hover:bg-orange-50/50 transition-colors';
            
            const actionHTML = parcel.status === 'pending' 
                ? `<button onclick="updateParcelStatus(${parcel.id})" class="bg-btn-orange hover:scale-105 transition-transform text-white px-8 py-2 rounded-full text-lg shadow-md">รับทราบ</button>`
                : `<span class="text-btn-green font-medium">รับทราบแล้ว</span>`;

            tr.innerHTML = `
                <td class="py-6 font-medium">${day}</td>
                <td class="py-6 font-medium">${month}</td>
                <td class="py-6 font-medium">${year}</td>
                <td class="py-6">${actionHTML}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateParcelStatus(parcelId) {
        let allParcels = JSON.parse(localStorage.getItem('parcelNotifications')) || [];
        
        allParcels = allParcels.map(p => {
            if (p.id === parcelId) {
                return { ...p, status: 'received' };
            }
            return p;
        });

        localStorage.setItem('parcelNotifications', JSON.stringify(allParcels));
        renderParcelTable();
    }

    function loadTenantData() {
        const roomsData = JSON.parse(localStorage.getItem('dormRoomsData')) || [];
        const myRoom = roomsData.find(room => room.tenantName && room.tenantName.includes("เจษฎา"));

        if (myRoom) {
            document.querySelectorAll('.display-room').forEach(el => el.innerText = myRoom.roomNum);
            document.querySelectorAll('.display-name').forEach(el => el.innerText = myRoom.tenantName);
        } else {
            document.querySelectorAll('.display-room').forEach(el => el.innerText = "23A"); // ค่า Default ถ้าหาไม่เจอ
            document.querySelectorAll('.display-name').forEach(el => el.innerText = "เจษฎา พรมภิบาล");
        }
    }

    function gotoPage(page) {
        setTimeout(() => { window.location.href = page; }, 100); 
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadTenantData();   
        renderParcelTable();  
        
        let currentPath = window.location.pathname.split("/").pop();
        if (currentPath === "") currentPath = "Main_Tenant.html";

        const navLinks = document.querySelectorAll("#main-nav .nav-btn");
        const indicator = document.getElementById("slide-indicator");

        let activeLink = Array.from(navLinks).find(link => 
            link.getAttribute("data-href").toLowerCase() === currentPath.toLowerCase()
        ) || navLinks[0];

        activeLink.classList.add("text-active");
        indicator.style.width = `${activeLink.offsetWidth}px`;
        indicator.style.left = `${activeLink.offsetLeft}px`;
        indicator.style.opacity = "1";
        setTimeout(() => { indicator.classList.add("animate-slide"); }, 50);

        navLinks.forEach(link => {
            link.addEventListener("click", function() {
                const targetPage = this.getAttribute("data-href");
                indicator.style.width = `${this.offsetWidth}px`;
                indicator.style.left = `${this.offsetLeft}px`;
                setTimeout(() => { window.location.href = targetPage; }, 250);
            });
        });
    });
</script>
</body>
</html>
