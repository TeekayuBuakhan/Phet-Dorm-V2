<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผู้เช่า - ข้อมูลส่วนตัว</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        'phet-blue': '#B3D8E8',
                        'phet-bg': '#FEFCE8',
                        'phet-orange': '#D35400',
                        'btn-orange': '#FF6530',
                        'btn-green': '#1ABC9C',
                        'btn-yellow': '#FEE101',
                    },
                },
            },
        }
    </script>
    <style>
        .tab-active { background-color: #FEFCE8; border-radius: 16px 16px 0 0; text-shadow: 0px 2px 4px rgba(0,0,0,0.15); box-shadow: 0 -4px 10px -4px rgba(0,0,0,0.05); }
        #slide-indicator { 
            position: absolute; bottom: 0; height: 40px; background-color: #FEFCE8; 
            border-radius: 16px 16px 0 0; box-shadow: 0 -4px 10px -4px rgba(0,0,0,0.05); 
            z-index: 10; opacity: 0; pointer-events: none; 
            will-change: transform, width, opacity; transform-origin: left center;
        }
        .text-active { font-weight: bold !important; color: #D35400 !important; text-shadow: 0px 2px 4px rgba(0,0,0,0.15) !important; }
    </style>
</head>
<body class="bg-phet-bg min-h-screen text-gray-800 flex flex-col">

    <header class="bg-phet-blue flex justify-between items-center px-8 h-16 shadow-md relative z-30">
        <div class="w-1/3 flex justify-start">
            <button onclick="gotoPage('Main_Tenant.html')" class="flex items-center space-x-3 w-fit p-1 rounded-lg transition-all duration-200 focus:outline-none hover:bg-white/20">
                <img src="../img/petch.logo.png" alt="หอพักเพชร" class="w-8 h-8"> 
                <div class="w-[3px] h-6 bg-phet-orange"></div> 
                <h1 class="text-xl font-bold tracking-wide">หอพักเพชร</h1>
            </button>
        </div>

        <nav id="main-nav" class="relative flex h-full items-end justify-center space-x-1 w-1/3">
            <div id="slide-indicator"></div>
            </nav>

        <div class="flex items-center justify-end w-1/3 space-x-4">
            <div class="relative">
                <button id="noti-btn" class="relative p-2 bg-white border border-gray-200 rounded-full text-gray-500 shadow-sm hover:shadow-md transition-all duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                </button>
                <div id="noti-dropdown" class="hidden absolute -right-6 mt-3 w-80 z-50">
                    <div class="absolute -top-2 right-[34px] w-5 h-5 bg-[#FCD8C4] transform rotate-45 rounded-sm"></div>
                    <div class="bg-[#FCD8C4] rounded-[24px] p-2.5 shadow-xl relative z-10">
                        <div class="bg-white rounded-[16px] flex flex-col overflow-hidden">
                            <div class="p-4 border-b text-center font-bold text-gray-700">แจ้งเตือน</div>
                            <button class="flex items-stretch text-left hover:bg-[#FEFCE8] p-4 group border-b last:border-0 transition-colors">
                                <div class="w-2 bg-phet-orange mr-3"></div>
                                <div>
                                    <p class="font-medium group-hover:text-phet-orange transition-colors">จอมมารตาก</p>
                                    <p class="text-xs text-gray-400">2 - พ.ค. - 2569</p>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="relative">
                <button id="profile-btn" class="flex items-center space-x-2 bg-white border border-gray-200 rounded-full px-4 py-1.5 text-gray-600 shadow-sm hover:shadow-md transition-all duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    <span class="text-sm font-medium">เจษฎา</span>
                </button>
                <div id="profile-dropdown" class="hidden absolute right-0 mt-3 w-72 z-50">
                    <div class="absolute -top-2 right-8 w-5 h-5 bg-[#FCD8C4] transform rotate-45 rounded-sm"></div>
                    <div class="bg-[#FCD8C4] rounded-[24px] p-2.5 shadow-xl relative z-10">
                        <div class="bg-white rounded-[16px] flex flex-col px-1 py-1">
                            <button onclick="window.history.back()" class="flex items-center justify-between px-4 py-3.5 hover:bg-[#FEFCE8] rounded-xl transition-colors group">
                                <div class="flex items-center space-x-3 text-phet-orange font-medium">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z" /></svg>
                                    <span>ย้อนกลับ</span>
                                </div>
                            </button>
                            <div class="h-[1px] bg-[#FCD8C4] mx-4 my-0.5 opacity-60"></div>
                            <button onclick="window.location.href='../index.html'" class="flex items-center justify-between px-4 py-3.5 hover:bg-[#FEFCE8] rounded-xl transition-colors group text-phet-orange font-medium">
                                <div class="flex items-center space-x-3">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" /></svg>
                                    <span>ออกจากระบบ</span>
                                </div>
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 group-hover:translate-x-1 transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" /></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

        <main class="flex-1 flex items-center justify-center px-6 py-12">
    <div class="bg-white p-10 rounded-[48px] shadow-2xl w-full max-w-md border-2 border-[#A5D8F3] relative text-center">
        
        <h2 class="text-4xl font-bold text-gray-800 mb-10">แก้ไขข้อมูลส่วนตัว</h2>

        <div class="space-y-4 mb-8 text-left">
            
            <div class="flex items-center space-x-3 text-lg px-4">
                <span class="font-bold text-gray-700 whitespace-nowrap">ชื่อ - สกุล :</span>
                <span class="text-gray-600">เจษฎา พรมภิบาล</span>
            </div>

            <div class="flex items-center justify-between bg-gray-50 p-4 rounded-2xl border border-gray-100 w-full">
                <div class="flex items-center space-x-2 text-lg whitespace-nowrap">
                    <span class="font-bold text-gray-700">เบอร์โทรศัพท์ :</span>
                    <span id="display-phone" class="text-gray-600">0841409452</span> 
                </div>
                
                <button onclick="gotoPage('ReTel.html')" class="px-4 py-1.5 bg-white border border-gray-200 text-phet-orange rounded-xl font-bold hover:scale-105 transition-all active:scale-95 whitespace-nowrap">
                    แก้ไข
                </button>
            </div>
            
            <button onclick="gotoPage('Re_Password.html')" class="w-full py-3 border-2 border-phet-orange text-phet-orange rounded-2xl font-bold hover:bg-phet-orange hover:text-white transition-all active:scale-95 mt-2">
                เปลี่ยนรหัสผ่าน
            </button>
        </div>

        <button onclick="alert('บันทึกข้อมูลเรียบร้อยแล้ว'); gotoPage('Main_Tenant.html')" class="w-full py-4 bg-phet-orange text-white rounded-2xl font-bold text-xl shadow-lg hover:bg-[#A04000] transition transform active:scale-95">
            บันทึกข้อมูล
        </button>

    </div> </main>

    <script>
        const initMenus = () => {
            const btns = { 'noti': 'noti-dropdown', 'profile': 'profile-dropdown' };
            Object.keys(btns).forEach(key => {
                const btn = document.getElementById(`${key}-btn`);
                const menu = document.getElementById(btns[key]);
                if (btn && menu) {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        Object.values(btns).forEach(id => {
                            if(id !== btns[key]) document.getElementById(id).classList.add('hidden');
                        });
                        menu.classList.toggle('hidden');
                    };
                }
            });
            window.onclick = () => {
                Object.values(btns).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.classList.add('hidden');
                });
            };
        };

        function gotoPage(page) {
            const active = document.querySelector(".text-active");
            const target = document.querySelector(`.nav-btn[data-href="${page}"]`);
            const indicator = document.getElementById("slide-indicator");

            if (active) {
                sessionStorage.setItem('navLeft', active.offsetLeft);
                sessionStorage.setItem('navWidth', active.offsetWidth);
            }

            if (target && indicator) {
                indicator.style.transition = "all 0.25s cubic-bezier(0.2, 1, 0.2, 1)";
                indicator.style.left = target.offsetLeft + "px";
                indicator.style.width = target.offsetWidth + "px";
            }

            setTimeout(() => { window.location.href = page; }, 150);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            initMenus();

            const savedPhone = localStorage.getItem('userPhone');
            const phoneDisplay = document.getElementById('display-phone');
            if (savedPhone && phoneDisplay) {
                phoneDisplay.innerText = savedPhone;
            }

            if (document.fonts) await document.fonts.ready;

            const navLinks = document.querySelectorAll("#main-nav .nav-btn");
            const indicator = document.getElementById("slide-indicator");
            if (!indicator || navLinks.length === 0) return;

            const currentPath = window.location.pathname.split("/").pop() || "Main_Tenant.html";
            const activeLink = Array.from(navLinks).find(link => 
                link.getAttribute("data-href").toLowerCase() === currentPath.toLowerCase()
            ) || navLinks[0];

            const prevLeft = sessionStorage.getItem('navLeft');
            const prevWidth = sessionStorage.getItem('navWidth');

            indicator.style.transition = "none";
            indicator.style.left = (prevLeft || activeLink.offsetLeft) + "px";
            indicator.style.width = (prevWidth || activeLink.offsetWidth) + "px";
            indicator.style.opacity = "1";

            requestAnimationFrame(() => {
                const _reflow = indicator.offsetWidth;
                requestAnimationFrame(() => {
                    indicator.style.transition = "all 0.4s cubic-bezier(0.2, 1, 0.2, 1)";
                    indicator.style.left = activeLink.offsetLeft + "px";
                    indicator.style.width = activeLink.offsetWidth + "px";
                    setTimeout(() => {
                        sessionStorage.removeItem('navLeft');
                        sessionStorage.removeItem('navWidth');
                    }, 400);
                });
            });

            activeLink.classList.add("text-active");
            activeLink.classList.remove("text-gray-700");

            navLinks.forEach(link => {
                link.onclick = (e) => { 
                    e.preventDefault(); 
                    gotoPage(link.getAttribute("data-href")); 
                };
            });
        });
    </script>
</body>
</html>
