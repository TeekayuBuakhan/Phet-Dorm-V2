<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>ผู้เช่า - ค่าเช่า</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        'phet-bg': '#F4F5F7',
                        'sidebar-bg': '#FFFFFF',
                        'phet-orange': '#D35400',
                        'btn-green': '#22C55E',
                    },
                },
            },
        }
    </script>
    <style>
        #slide-indicator { 
            position: absolute; bottom: 0; height: 40px; background-color: #FFFFFF; 
            border-radius: 16px 16px 0 0; box-shadow: 0 -4px 10px -4px rgba(0,0,0,0.05); 
            z-index: 10; opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.2, 1, 0.2, 1);
        }
        .text-active { font-weight: bold !important; color: #D35400 !important; text-shadow: 0px 2px 4px rgba(0,0,0,0.15) !important; }
        #pay-method-wrapper { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease, opacity 0.2s; opacity: 0; }
        #pay-method-wrapper.show { grid-template-rows: 1fr; opacity: 1; }
        #pay-method-menu { overflow: hidden; }
        .modal-blur { backdrop-filter: blur(4px); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-phet-bg min-h-screen text-gray-800 font-sans">

    <header class="bg-white border-b border-gray-200 flex justify-between items-center px-8 h-16 shadow-md relative z-30">
    <div class="w-1/3 flex justify-start">
        <button onclick="gotoPage('Main_Tenant.html')" class="flex items-center space-x-3 w-fit p-1 rounded-lg transition-all duration-200 focus:outline-none hover:bg-white/20">
            <div class="w-8 h-8 rounded flex items-center justify-center text-phet-orange">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/><path d="M2 9h20"/><path d="M12 21V9"/><path d="M18 3l-6 6"/><path d="M6 3l6 6"/></svg>
            </div>
            <div class="w-[3px] h-6 bg-phet-orange"></div> 
            <h1 class="text-xl font-bold tracking-wide text-phet-orange">หอพักเพชร</h1>
        </button>
    </div>

    <nav id="main-nav" class="relative flex h-full items-end justify-center space-x-1 w-1/3"> 
        <div id="slide-indicator"></div>
        <button data-href="Main_Tenant.html" class="nav-btn px-6 pt-2 pb-2.5 text-[15px] font-medium text-gray-700 hover:text-phet-orange transition relative z-20">หน้าหลัก</button>
        <button data-href="Bill.html" class="nav-btn px-6 pt-2 pb-2.5 text-[15px] font-medium text-gray-700 hover:text-phet-orange transition relative z-20">ค่าเช่า</button>
        <button data-href="Repair.html" class="nav-btn px-6 pt-2 pb-2.5 text-[15px] font-medium text-gray-700 hover:text-phet-orange transition relative z-20">แจ้งเหตุ</button>
    </nav>

    <div class="flex items-center justify-end w-1/3 space-x-4">
        <div class="relative">
            <button id="noti-btn" class="relative p-2 bg-white border border-gray-200 rounded-full text-gray-500 shadow-sm hover:shadow-md hover:text-phet-orange transition-all duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
            </button>
            <div id="noti-dropdown" class="hidden absolute -right-6 mt-3 w-80 z-50">
                    <div class="absolute -top-2 right-[34px] w-5 h-5 bg-[#F3F4F6] transform rotate-45 rounded-sm"></div>
                    <div class="bg-[#F3F4F6] rounded-[24px] p-2.5 shadow-xl relative z-10">
                        <div class="bg-white rounded-[16px] flex flex-col overflow-hidden">
                            <div class="p-4 border-b text-center font-bold text-gray-700">แจ้งเตือน</div>
                            <button class="flex items-stretch text-left hover:bg-[#F5F5F5] p-4 group border-b last:border-0 transition-colors">
                                <div class="w-2 bg-phet-orange mr-3"></div>
                                <div>
                                    <p class="font-medium group-hover:text-phet-orange transition-colors">จอมมารตาก</p>
                                    <p class="text-xs text-gray-400">2 - พ.ค. - 2569</p>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        <div class="relative">
            <button id="profile-btn" class="flex items-center space-x-2 bg-white border border-gray-200 rounded-full px-4 py-1.5 text-gray-600 shadow-sm hover:shadow-md hover:text-phet-orange hover:border-phet-orange transition-all duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                <span class="text-sm font-medium">เจษฎา</span>
            </button>
            <div id="profile-dropdown" class="hidden absolute right-0 mt-3 w-72 z-50">
                <div class="absolute -top-2 right-8 w-5 h-5 bg-[#F3F4F6] transform rotate-45 rounded-sm"></div>
                <div class="bg-[#F3F4F6] rounded-[24px] p-2.5 shadow-[0_10px_25px_rgba(0,0,0,0.15)] relative z-10">
                    <div class="bg-white rounded-[16px] flex flex-col px-1 py-1">
                        <button onclick="window.location.href='Profile.html'" class="flex items-center justify-between px-4 py-3.5 hover:bg-[#F5F5F5] rounded-xl transition-colors group">
                            <div class="flex items-center space-x-3 text-phet-orange">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.89 1.147l-3.102.933a.675.675 0 01-.836-.836l.932-3.102a4.5 4.5 0 011.147-1.89L16.862 4.487zM16.862 4.487L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" /></svg>
                                <span class="font-medium text-[16px]">แก้ไขข้อมูลส่วนตัว</span>
                            </div>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-phet-orange group-hover:translate-x-1 transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" /></svg>
                        </button>
                        <div class="h-[1px] bg-[#E5E7EB] mx-4 my-0.5 opacity-60"></div>
                        <button onclick="window.location.href='../index.html'" class="flex items-center justify-between px-4 py-3.5 hover:bg-[#F5F5F5] rounded-xl transition-colors group">
                            <div class="flex items-center space-x-3 text-phet-orange">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" /></svg>
                                <span class="font-medium text-[16px]">ออกจากระบบ</span>
                            </div>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-phet-orange group-hover:translate-x-1 transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" /></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

    <main class="max-w-5xl mx-auto px-6 py-10 relative z-0">
        <div class="w-full bg-phet-orange rounded-[40px] p-10 text-white shadow-xl flex flex-col md:flex-row justify-between items-start mb-10 overflow-visible">
            <div class="flex items-start space-x-6">
                <div class=" p-4 rounded-3xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                </div>
                <div class="space-y-1">
                    <h2 class="text-4xl font-bold tracking-tight">ห้อง : <span class="display-room ml-2">-</span></h2>
                    <div class="text-2xl font-medium opacity-90"><p>ค่าไฟหน่วยละ <span class="display-elec">-</span> บาท</p><p>ค่าน้ำ <span class="display-water">-</span> บาท</p></div>
                </div>
            </div>

            <div class="mt-8 md:mt-0 flex flex-col items-end w-full md:w-auto">
                <p class="text-2xl font-medium mb-6">ยอดค้างชำระ <span id="total-debt-display" class="text-4xl font-bold ml-2 text-phet-orange">0</span> บาท</p>
                <div class="relative w-full md:w-72">
                    <button id="pay-method-btn" class="w-full bg-white px-6 py-4 rounded-2xl text-xl font-medium flex items-center justify-between shadow-lg text-gray-400 transition-all">
                        <span id="selected-method">เลือกช่องทางชำระ</span>
                        <svg id="chevron-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M19 9l-7 7-7-7" /></svg>
                    </button>
                    <div id="pay-method-wrapper" class="absolute left-0 right-0 z-50">
                        <div id="pay-method-menu" class="bg-white rounded-3xl shadow-2xl mt-2 border border-gray-100 p-2">
                            <button onclick="selectMethod('ธนาคาร')" class="w-full text-left text-gray-700 px-5 py-4 hover:bg-phet-bg hover:text-phet-orange rounded-2xl text-lg font-medium border-b">ธนาคาร</button>
                            <button onclick="selectMethod('เงินสด')" class="w-full text-left text-gray-700 px-5 py-4 hover:bg-phet-bg hover:text-phet-orange rounded-2xl text-lg font-medium">เงินสด</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full bg-white rounded-[50px] shadow-lg overflow-hidden p-10">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="text-2xl font-bold text-gray-800 border-b-2 border-gray-100">
                        <th class="pb-8">เดือน</th>
                        <th class="pb-8 text-center">ยอดรวม</th>
                        <th class="pb-8 text-center">สถานะ</th>
                        <th class="pb-8 text-center w-40"></th> 
                        <th class="pb-8 text-center w-32 pr-6">ดูบิล</th>
                    </tr>
                </thead>
                <tbody id="tenant-bill-body" class="text-xl font-medium">
                </tbody>
            </table>
        </div>
    </main>

    <div id="bill-modal" class="fixed inset-0 bg-black/50 z-[100] hidden items-center justify-center modal-blur px-4">
        <div class="bg-white w-full max-w-[480px] rounded-[40px] shadow-2xl overflow-hidden">
            <div class="bg-phet-orange p-5 text-white text-center"><h3 class="text-2xl font-bold">บิลค่าเช่า <span id="modal-month"></span></h3></div>
            <div class="p-8 space-y-6">
                <div class="flex justify-between items-start">
                    <div class="flex flex-col space-y-1">
                        <p class="text-4xl font-bold tracking-tight text-gray-800">ห้อง : <span class="display-room ml-2">-</span></p>
                        <p class="text-2xl font-medium text-gray-500">ชื่อผู้เช่า : <span class="display-name ml-2">-</span></p>
                    </div>
                    <span id="modal-status" class="text-xl font-bold whitespace-nowrap text-right"></span>
                </div>
                <div class="space-y-3">
                    <div class="bg-phet-orange/10 p-3 rounded-xl text-phet-orange font-bold text-xl">สรุปรายการ</div>
                    <div class="px-2 space-y-3 text-lg">
                        <div class="flex justify-between"><span>ค่าห้อง</span><span>1,900 บาท</span></div>
                        <div class="flex justify-between"><div><span>ค่าไฟ</span> <span id="modal-elec-unit" class="text-gray-400 text-sm"></span></div><span id="modal-elec-price"></span></div>
                        <div class="flex justify-between border-b pb-3"><span>ค่าน้ำ</span><span>100 บาท</span></div>
                        <div class="flex justify-between text-2xl font-bold text-phet-orange pt-2"><span>ยอดรวมทั้งสิ้น</span><span><span id="modal-total"></span> บาท</span></div>
                    </div>
                </div>
                <button onclick="closeModal('bill-modal')" class="w-full py-4 bg-gray-100 hover:bg-gray-200 rounded-2xl font-bold transition-all">ปิด</button>
            </div>
        </div>
    </div>

    <div id="payment-modal" class="fixed inset-0 bg-black/50 z-[110] hidden items-center justify-center modal-blur px-4">
        <div class="bg-white w-full max-w-[500px] rounded-[40px] shadow-2xl overflow-hidden animate-in zoom-in duration-200">
            <div class="bg-phet-orange p-5 text-white text-center">
                <h3 class="text-2xl font-bold">ชำระเงิน (<span id="pay-method-display"></span>)</h3>
                <p class="text-sm opacity-80">เดือน <span id="pay-modal-title"></span></p>
            </div>
            <div id="payment-content" class="p-8"></div>
        </div>
    </div>

    <div id="alert-error" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-black/30 modal-blur">
        <div class="bg-white rounded-[40px] p-10 flex flex-col items-center space-y-6 shadow-2xl max-w-xs w-full animate-in zoom-in duration-300">
            <div class="w-20 h-20 rounded-full border-[6px] border-red-500 flex items-center justify-center"><span class="text-red-500 text-5xl font-bold">!</span></div>
            <p class="text-phet-orange text-2xl font-bold text-center">กรุณาเลือกช่องทาง<br>ชำระเงิน</p>
            <button onclick="closeModal('alert-error')" class="w-full py-3 bg-gray-100 rounded-xl font-bold hover:bg-gray-200">เข้าใจแล้ว</button>
        </div>
    </div>

    <script>
        let currentMethod = "";
        let currentSlipImage = null; // <--- เพิ่มตัวแปรสำหรับเก็บรูปสลิป
        let currentPayingMonthYear = ""; // ย้ายมารวมกันด้านบนสุด ป้องกัน Error

        const initDropdowns = () => {
            const btnNoti = document.getElementById('noti-btn'), dropNoti = document.getElementById('noti-dropdown');
            const btnProf = document.getElementById('profile-btn'), dropProf = document.getElementById('profile-dropdown');

            btnNoti.onclick = (e) => { e.stopPropagation(); dropNoti.classList.toggle('hidden'); dropProf.classList.add('hidden'); };
            btnProf.onclick = (e) => { e.stopPropagation(); dropProf.classList.toggle('hidden'); dropNoti.classList.add('hidden'); };
            
            document.getElementById('pay-method-btn').onclick = (e) => {
                e.stopPropagation();
                document.getElementById('pay-method-wrapper').classList.toggle('show');
                document.getElementById('chevron-icon').classList.toggle('rotate-180');
            };

            window.onclick = (e) => {
                [dropNoti, dropProf].forEach(m => m?.classList.add('hidden'));
                document.getElementById('pay-method-wrapper').classList.remove('show');
                document.getElementById('chevron-icon').classList.remove('rotate-180');
    
                if (e.target.classList.contains('modal-blur')) {
                    closeModal(e.target.id);
                }
            };
        };

        function gotoPage(page) {
            const indicator = document.getElementById("slide-indicator");
            const active = document.querySelector(".text-active"); 

            if (active) {
                sessionStorage.setItem('navLeft', active.offsetLeft);
                sessionStorage.setItem('navWidth', active.offsetWidth);
            }
            setTimeout(() => { 
                window.location.href = page; 
            }, 100); 
        }

        function selectMethod(method) {
            currentMethod = method;
            const label = document.getElementById('selected-method'), chevron = document.getElementById('chevron-icon');
            label.innerText = method; 
            label.className = "text-phet-orange font-bold text-xl";
            chevron.classList.add('text-phet-orange');
        }

        function closeModal(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('hidden');
                el.classList.remove('flex');
                document.body.style.overflow = 'auto';
            }
        }

        function openBillDetail(month, status, total, unit, elecPrice) {
            document.getElementById('modal-month').innerText = month;
            document.getElementById('modal-total').innerText = total;
            document.getElementById('modal-elec-unit').innerText = unit;
            document.getElementById('modal-elec-price').innerText = elecPrice + " บาท";
            const st = document.getElementById('modal-status');
            st.innerText = status;
            st.className = `text-xl font-bold ${status === 'ค้างชำระ' ? 'text-red-500' : 'text-btn-green'}`;
            
            const billModal = document.getElementById('bill-modal');
            billModal.classList.remove('hidden');
            billModal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function openPaymentModal(month, amount) {
            currentSlipImage = null; // เคลียร์รูปสลิปทุกครั้งที่เปิด Modal ใหม่

            if (!currentMethod) {
                const errModal = document.getElementById('alert-error');
                errModal.classList.remove('hidden');
                errModal.classList.add('flex');
                return;
            }

            // ... โค้ดส่วนดึงข้อมูลมาแสดงยังเหมือนเดิม
            currentPayingMonthYear = month; 
            document.getElementById('pay-modal-title').innerText = month;
            document.getElementById('pay-method-display').innerText = currentMethod;
            const content = document.getElementById('payment-content');

            if (currentMethod === 'ธนาคาร') {
                content.innerHTML = `
                    <div class="flex flex-col items-center space-y-6">
                        <p class="text-xl font-bold text-gray-700">ยอดโอน: <span class="text-phet-orange text-3xl">${amount} บาท</span></p>
                        <div class="w-56 h-56 bg-white border-2 border-orange-100 rounded-3xl flex items-center justify-center overflow-hidden shadow-inner p-2" id="qr-box">
                            <img src="../img/Bill-QR.jpg" alt="QR PromptPay" class="w-full h-full object-contain">
                        </div>
                        <p class="text-gray-400 text-lg font-medium -mt-4 italic">สแกนเพื่อชำระเงิน</p>
                        <input type="file" id="slip-in" class="hidden" onchange="previewSlip(this)">
                        <label id="slip-label" for="slip-in" class="group w-full flex items-center justify-center space-x-2 bg-phet-bg text-phet-orange py-4 rounded-2xl cursor-pointer border-2 border-orange-100 hover:bg-orange-50 transition-all shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                            </svg>
                            <span class="text-xl font-medium">แนบหลักฐานการโอน</span>
                        </label>
                        <div class="flex space-x-3 w-full">
                            <button onclick="closeModal('payment-modal')" class="flex-1 py-4 bg-gray-100 rounded-2xl font-bold text-gray-500 hover:bg-gray-200">ยกเลิก</button>
                            <button onclick="confirmSubmit()" class="flex-1 py-4 bg-btn-green text-white rounded-2xl font-bold shadow-lg hover:brightness-110">ยืนยันการส่ง</button>
                        </div>
                    </div>`;
            } else {
                content.innerHTML = `
                    <div class="flex flex-col items-center space-y-6 py-4 text-center">
                        <div class="w-20 h-20 bg-orange-50 rounded-full flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-phet-orange" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                        </div>
                        <p class="text-xl font-medium text-gray-700">กรุณาชำระเงินสดจำนวน <span class="text-phet-orange font-bold">${amount} บาท</span><br>ได้ที่บ้านเจ้าของหอพัก</p>
                        <button onclick="confirmSubmit()" class="w-full py-4 bg-btn-green text-white rounded-2xl font-bold shadow-lg mt-4">รับทราบ</button>
                    </div>`;
            }
            const modal = document.getElementById('payment-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function previewSlip(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    currentSlipImage = e.target.result; // <--- เก็บรูปสลิปเอาไว้
                    document.getElementById('qr-box').innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                    document.getElementById('slip-label').innerHTML = `<span class="text-btn-green font-bold">เลือกไฟล์เรียบร้อยแล้ว ✅</span>`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function confirmSubmit() {
            closeModal('payment-modal');
            
            if (!currentPayingMonthYear) return;
            
            // แยกเดือนและปี เพื่อไปหาใน LocalStorage
            const [month, year] = currentPayingMonthYear.split('/');
            const billKey = `bill_${month}_${year}`;
            
            // หาเลขห้อง
            const roomsData = JSON.parse(localStorage.getItem('dormRoomsData')) || [];
            const myRoom = roomsData.find(room => room.tenantName && room.tenantName.includes("เจษฎา"));
            const roomNum = myRoom ? myRoom.roomNum : "23A";

            // อัปเดตสถานะและเก็บสลิป
            let billData = JSON.parse(localStorage.getItem(billKey));
            if (billData && billData[roomNum]) {
                billData[roomNum].status = "รออนุมัติการชำระเงิน";
                
                // บันทึกสลิปและวิธีการชำระ
                if (currentMethod === 'ธนาคาร' && currentSlipImage) {
                    billData[roomNum].slipImage = currentSlipImage;
                    billData[roomNum].payMethod = 'โอนเงิน';
                } else {
                    billData[roomNum].payMethod = 'เงินสด';
                }

                localStorage.setItem(billKey, JSON.stringify(billData));
                loadBillingData(); // รีโหลดตาราง
            }
        }

        function loadTenantData() {
            const roomsData = JSON.parse(localStorage.getItem('dormRoomsData')) || [];
            const myRoom = roomsData.find(room => room.tenantName && room.tenantName.includes("เจษฎา"));

            if (myRoom) {
                document.querySelectorAll('.display-room').forEach(el => el.innerText = myRoom.roomNum);
                document.querySelectorAll('.display-name').forEach(el => el.innerText = myRoom.tenantName);
                document.querySelectorAll('.display-elec').forEach(el => el.innerText = myRoom.elecRate || '8');
                document.querySelectorAll('.display-water').forEach(el => el.innerText = myRoom.waterRate || '100 (เหมาจ่าย)');
            } else {
                document.querySelectorAll('.display-room').forEach(el => el.innerText = "ไม่มีห้อง");
                document.querySelectorAll('.display-name').forEach(el => el.innerText = "เจษฎา พรมภิบาล");
            }
        }

        function loadBillingData() {
            const roomsData = JSON.parse(localStorage.getItem('dormRoomsData')) || [];
            const myRoom = roomsData.find(room => room.tenantName && room.tenantName.includes("เจษฎา"));
            const roomNum = myRoom ? myRoom.roomNum : "23A";
            
            const tbody = document.getElementById('tenant-bill-body');
            tbody.innerHTML = ''; 
            
            let totalOwed = 0;
            let hasBills = false;
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('bill_')) {
                    const [, month, year] = key.split('_');
                    try {
                        const billData = JSON.parse(localStorage.getItem(key));
                        
                        if (billData && billData[roomNum] && billData[roomNum].isSent) {
                            hasBills = true;
                            const bill = billData[roomNum];
                            
                            let statusColor = "text-red-500";
                            let statusText = bill.status === "รอชำระเงิน" ? "ค้างชำระ" : bill.status;
                            let actionHtml = '';
                            
                            if (bill.status === "รอชำระเงิน") {
                                statusColor = "text-red-500";
                                totalOwed += bill.total;
                                actionHtml = `<button onclick="openPaymentModal('${month}/${year}', '${bill.total.toLocaleString()}')" class="bg-[#FCE7F3] text-[#D81B60] px-8 py-2 rounded-full font-bold hover:scale-105 transition-all shadow-sm">ชำระเงิน</button>`;
                            } else if (bill.status === "รออนุมัติการชำระเงิน") {
                                statusColor = "text-phet-orange";
                                actionHtml = `<span class="text-gray-400 font-medium px-4">รอตรวจสอบ</span>`;
                            } else if (bill.status === "ชำระเงินแล้ว") {
                                statusColor = "text-btn-green";
                                actionHtml = `<span class="text-btn-green font-bold px-4 whitespace-nowrap">✓ ชำระเรียบร้อย</span>`;
                            }
                            
                            const tr = document.createElement('tr');
                            tr.className = "border-b last:border-0 hover:bg-gray-50/50 transition-colors";
                            tr.innerHTML = `
                                <td class="py-6">${month} ${year}</td>
                                <td class="py-6 text-center">${bill.total.toLocaleString()}</td>
                                <td class="py-6 text-center ${statusColor} font-bold">${statusText}</td>
                                
                                <td class="py-6 text-center">
                                    ${actionHtml}
                                </td>
                                
                                <td class="py-6 text-center pr-6">
                                    <button onclick="openBillDetail('${month}/${year}', '${statusText}', '${bill.total.toLocaleString()}', '(${bill.elecUnit || 0} หน่วย)', '${bill.elecCost || 0}')" class="inline-flex items-center justify-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-400 hover:text-[#CF4B00] transition-colors" viewBox="0 0 20 22" fill="none">
                                            <path fill-rule="evenodd" clip-rule="evenodd" d="M4.84878 3.9921e-05C4.89683 5.9921e-05 4.94559 7.98561e-05 4.99508 7.98561e-05H14.5051C14.5546 7.98561e-05 14.6033 5.9921e-05 14.6514 3.9921e-05C15.6681 -0.000400079 16.3679 -0.000710145 16.9572 0.20435C18.0702 0.59161 18.9343 1.48726 19.3047 2.61559C19.5008 3.21271 19.5005 3.92254 19.5001 4.97655C19.5001 5.02372 19.5001 5.07158 19.5001 5.12014V19.1243C19.5001 20.5895 17.7731 21.4618 16.6357 20.421C16.5562 20.3483 16.444 20.3483 16.3645 20.421L15.8814 20.8631C14.9532 21.7124 13.547 21.7124 12.6188 20.8631C12.2638 20.5382 11.7364 20.5382 11.3814 20.8631C10.4532 21.7124 9.04696 21.7124 8.11876 20.8631C7.76376 20.5382 7.23637 20.5382 6.88138 20.8631C5.95319 21.7124 4.54694 21.7124 3.61875 20.8631L3.13566 20.421C3.05618 20.3483 2.94395 20.3483 2.86448 20.421C1.72705 21.4618 7.28134e-05 20.5895 7.28134e-05 19.1243V5.12014C7.28134e-05 5.07158 5.27591e-05 5.02372 3.27591e-05 4.97655C-0.000347241 3.92255 -0.000607222 3.21271 0.195453 2.61559C0.565913 1.48726 1.43002 0.59161 2.54298 0.20435C3.1323 -0.000710145 3.83203 -0.000400079 4.84878 3.9921e-05ZM4.99508 1.50008C3.774 1.50008 3.3534 1.51057 3.03593 1.62103C2.37655 1.85047 1.84919 2.38728 1.6206 3.0835C1.50951 3.42183 1.50007 3.86796 1.50007 5.12014V19.1243C1.50007 19.2433 1.55999 19.3161 1.63517 19.3509C1.67433 19.369 1.71264 19.3737 1.74455 19.3694C1.77269 19.3656 1.8091 19.3535 1.85185 19.3144C2.50453 18.7171 3.49561 18.7171 4.14828 19.3144L4.63138 19.7565C4.98637 20.0813 5.51377 20.0813 5.86875 19.7565C6.79694 18.9071 8.20316 18.9071 9.13136 19.7565C9.48636 20.0813 10.0138 20.0813 10.3688 19.7565C11.297 18.9071 12.7032 18.9071 13.6314 19.7565C13.9864 20.0813 14.5138 20.0813 14.8688 19.7565L15.3519 19.3144C16.0046 18.7171 16.9956 18.7171 17.6483 19.3144C17.6911 19.3535 17.7275 19.3656 17.7556 19.3694C17.7875 19.3737 17.8258 19.369 17.865 19.3509C17.9402 19.3161 18.0001 19.2434 18.0001 19.1243V5.12014C18.0001 3.86797 17.9907 3.4                                         </svg>
                                    </button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        }
                    } catch (err) {
                        console.error("Invalid bill format in localStorage:", key);
                    }
                }
            }
            
            if (!hasBills) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-gray-500">ยังไม่มีรายการบิลค่าเช่า</td></tr>`;
            }
            
            const debtDisplay = document.getElementById('total-debt-display');
            if(debtDisplay) debtDisplay.innerText = totalOwed.toLocaleString();
        }

        // --- ส่วนรันคำสั่งเมื่อหน้าเว็บโหลดเสร็จ ---
        document.addEventListener("DOMContentLoaded", () => {
            loadTenantData();
            initDropdowns();
            loadBillingData();

            // จัดการระบบเปลี่ยนหน้า (Navigation)
            const nav = document.getElementById("main-nav");
            const ind = document.getElementById("slide-indicator");
            const links = nav.querySelectorAll(".nav-btn");
            
            // หาว่าตอนนี้อยู่เมนูไหน
            const activeLink = Array.from(links).find(l => l.getAttribute("data-href").toLowerCase() === "bill.html") || links[1];
            
            if (activeLink && ind) {
                ind.style.left = activeLink.offsetLeft + "px";
                ind.style.width = activeLink.offsetWidth + "px";
                ind.style.opacity = "1";
                activeLink.classList.add("text-active");
            }

            // ผูก Event ให้แต่ละปุ่มสามารถเปลี่ยนหน้าได้
            links.forEach(l => {
                l.addEventListener("click", function(e) {
                    e.preventDefault(); 
                    const target = this.getAttribute("data-href");
                    
                    if (ind) {
                        ind.style.left = this.offsetLeft + "px";
                        ind.style.width = this.offsetWidth + "px";
                    }
                    
                    links.forEach(btn => btn.classList.remove("text-active"));
                    this.classList.add("text-active");

                    if (target && target.toLowerCase() !== "bill.html") {
                        setTimeout(() => {
                            window.location.href = target;
                        }, 250);
                    }
                });
            });
        });
    </script>
