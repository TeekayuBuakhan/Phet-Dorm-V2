<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>แก้ไขข้อมูลส่วนตัว-เบอร์โทรศัพท์</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        'phet-blue': '#B3D8E8',
                        'phet-bg': '#FEFCE8',
                        'phet-orange': '#D35400',
                        'btn-orange': '#FF6530',
                        'btn-green': '#1ABC9C',
                        'btn-yellow': '#FEE101',
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-phet-bg min-h-screen flex flex-col font-sans text-gray-800">

    <header class="bg-phet-blue px-8 h-16 flex items-center justify-between shadow-md relative z-30">
        <div class="w-1/3 flex justify-start">
            <button onclick="gotoPage('Main_Tenant.html')" class="flex items-center space-x-3 w-fit p-1 rounded-lg transition-all duration-200 focus:outline-none hover:bg-white/20">
                <img src="../img/petch.logo.png" alt="หอพักเพชร" class="w-8 h-8"> 
                <div class="w-[3px] h-6 bg-phet-orange"></div> 
                <h1 class="text-xl font-bold tracking-wide">หอพักเพชร</h1>
            </button>
        </div>
        <div class="w-1/3"></div>
        <div class="w-1/3"></div>
    </header>

    <main class="flex-1 flex items-center justify-center px-6 py-10">
        <div class="bg-white rounded-[40px] w-full max-w-lg p-10 shadow-xl border border-orange-50">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-gray-800">แก้ไขข้อมูลส่วนตัว</h2>
                <p class="text-gray-500 mt-2 text-lg">เปลี่ยนเบอร์โทรศัพท์มือถือ</p>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-400 mb-2 ml-1 uppercase tracking-wider">เบอร์โทรศัพท์เดิม</label>
                    <input type="text" id="old-phone-input" readonly 
                        class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-[24px] text-gray-400 focus:outline-none cursor-not-allowed text-lg">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2 ml-1">เบอร์โทรศัพท์ใหม่</label>
                    <input type="text" id="new-phone-input" placeholder="กรอกเบอร์ 10 หลัก" maxlength="10"
                        class="w-full px-5 py-4 border border-gray-200 rounded-[24px] focus:ring-2 focus:ring-phet-orange focus:border-phet-orange outline-none transition-all text-lg shadow-sm">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2 ml-1">ยืนยันรหัส OTP</label>
                    <div class="flex space-x-3">
                        <input type="text" id="otp-input" placeholder="เลข 6 หลัก" maxlength="6"
                            class="flex-1 px-5 py-4 border border-gray-200 rounded-[24px] focus:ring-2 focus:ring-phet-orange outline-none transition-all text-lg shadow-sm">
                        <button onclick="sendOTP()" id="send-otp-btn" 
                            class="px-6 py-4 bg-phet-orange text-white rounded-[24px] font-bold hover:bg-orange-600 transition-all shadow-md active:scale-95 whitespace-nowrap">
                            ส่งรหัส
                        </button>
                    </div>
                </div>
            </div>

            <div class="mt-12 flex flex-col space-y-3">
                <button onclick="confirmChangePhone()" 
                    class="w-full py-4 bg-phet-orange text-white rounded-[24px] text-xl font-bold shadow-lg shadow-orange-100 hover:bg-orange-600 active:scale-95 transition-all">
                    บันทึกการเปลี่ยนแปลง
                </button>
                <button onclick="history.back()" 
                    class="w-full py-4 bg-white text-gray-400 rounded-[24px] text-lg font-medium hover:text-gray-600 transition-all">
                    ยกเลิก
                </button>
            </div>
        </div>
    </main>

    <script>
        function gotoPage(page) {
            window.location.href = page;
        }
        document.addEventListener("DOMContentLoaded", () => {
            const savedPhone = localStorage.getItem('userPhone') || '0990990991';
            document.getElementById('old-phone-input').value = savedPhone;
        });

        function sendOTP() {
            const newPhone = document.getElementById('new-phone-input').value;
            if (newPhone.length < 10) {
                alert('กรุณากรอกเบอร์โทรศัพท์ใหม่ให้ถูกต้องก่อนครับ');
                return;
            }
            
            const btn = document.getElementById('send-otp-btn');
            btn.innerText = 'ส่งแล้ว';
            btn.disabled = true;
            btn.className = "px-6 py-4 bg-gray-300 text-gray-500 rounded-[24px] font-bold cursor-not-allowed";
            
            alert('รหัส OTP ของคุณคือ: 123456 (ตัวอย่าง)');
        }

        function confirmChangePhone() {
            const newPhone = document.getElementById('new-phone-input').value;
            const otp = document.getElementById('otp-input').value;

            if (newPhone.length === 10 && otp === '123456') {
                localStorage.setItem('userPhone', newPhone);
                
                alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
                
                window.location.href = 'Profile.html'; 
            } else {
                alert('ข้อมูลไม่ถูกต้อง กรุณาตรวจสอบเบอร์โทรหรือรหัส OTP');
            }
        }
    </script>
</body>
</html>
