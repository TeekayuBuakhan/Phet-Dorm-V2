<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ - หอพักเพชร</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FEFCE8] min-h-screen flex flex-col font-sans">

    <header class="bg-[#B3D8E8] px-6 py-3 flex items-center justify-between shadow-sm">
        <div class="w-1/3 flex justify-start">
        <button onclick="window.location.href='Main_Tenant.html'" ...>

        <button onclick="gotoPage('Main_Tenant.html')" class="flex items-center space-x-3 w-fit p-1 rounded-lg transition-all duration-200 focus:outline-none hover:bg-white/20">
            <img src="../img/petch.logo.png" alt="หอพักเพชร" class="w-8 h-8"> 
            <div class="w-[3px] h-6 bg-phet-orange"></div> 
            <h1 class="text-xl font-bold tracking-wide">หอพักเพชร</h1>
        </button>
    </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-6 py-10">
    <div class="bg-white p-8 rounded-[32px] shadow-2xl w-full max-w-md border-2 border-[#A5D8F3] relative">
        
        <button onclick="window.history.back()" 
                class="absolute top-6 right-6 text-gray-400 hover:text-[#D35400] transition-all transform hover:scale-110 active:scale-95" 
                title="ย้อนกลับ">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z" />
            </svg>
        </button>

        <h2 class="text-3xl font-bold text-center text-[#1E3A8A] mb-2 mt-4">ตั้งรหัสผ่านใหม่</h2>
        <p class="text-center text-gray-500 mb-8 text-sm">สร้างรหัสผ่านใหม่ที่ปลอดภัยสำหรับบัญชีของคุณ</p>

        <div class="mb-5">
            <label class="block text-gray-700 mb-2 font-medium">รหัสผ่านใหม่</label>
            <input type="password" id="newPassword" placeholder="อย่างน้อย 6 ตัวอักษร"
                class="w-full p-4 border-2 border-gray-200 rounded-2xl focus:border-[#D35400] outline-none transition">
        </div>

        <div class="mb-8">
            <label class="block text-gray-700 mb-2 font-medium">ยืนยันรหัสผ่านใหม่</label>
            <input type="password" id="confirmPassword" placeholder="กรอกรหัสผ่านอีกครั้ง"
                class="w-full p-4 border-2 border-gray-200 rounded-2xl focus:border-[#D35400] outline-none transition">
        </div>

        <button onclick="handleResetSubmit()" 
            class="w-full bg-[#D35400] text-white py-4 rounded-2xl font-bold text-xl shadow-lg hover:bg-[#A04000] transition transform hover:scale-[1.02] active:scale-95 mb-4">
            บันทึกรหัสผ่านใหม่
        </button>
    </div>
</main>

    <script>
        function handleResetSubmit() {
            const pass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            // ตรวจสอบความยาวรหัส
            if (pass.length < 6) {
                alert("รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษรครับ");
                return;
            }

            // ตรวจสอบว่ารหัสตรงกันไหม
            if (pass !== confirmPass) {
                alert("รหัสผ่านทั้งสองช่องไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง");
                return;
            }

            // จำลองการบันทึกข้อมูล
            alert("เปลี่ยนรหัสผ่านสำเร็จแล้ว! กรุณาล็อกอินด้วยรหัสผ่านใหม่ครับ");
            
            // ส่งกลับไปหน้า Login
            window.location.href = 'Login.html';
        }

        function gotoPage(page) {
        const indicator = document.getElementById("slide-indicator");
        const active = document.querySelector(".text-active"); 

        if (active) {
            sessionStorage.setItem('navLeft', active.offsetLeft);
            sessionStorage.setItem('navWidth', active.offsetWidth);
        }
        setTimeout(() => { 
        window.location.href = page; 
        }, 100); 
        }
    </script>
</body>
</html>
