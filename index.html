<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>หอพักเพชร-ยินดีต้อนรับ</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        'phet-blue': '#B3D8E8',
                        'phet-bg': '#FEFCE8',
                        'phet-orange': '#D35400',
                        'btn-orange': '#FF6530',
                        'btn-green': '#1ABC9C',
                        'btn-yellow': '#FEE101',
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-[#FEFCE8] min-h-screen flex flex-col">
 
    <header class="bg-[#B3D8E8] px-6 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <img src="img/petch.logo.png" alt="หอพักเพชร" class="w-12 h-12">
            <div class="w-[4px] h-12 bg-[#D35400]"></div>
            <h1 class="text-3xl font-bold text-gray-800">หอพักเพชร</h1>
        </div>
 
        <div class="flex space-x-4">
            <button onclick="gotoPage('Vacant/vacant_room.html')" class="bg-[#FEFCE8] border-2 border-[#D35400] text-[#D35400] px-4 py-1.5 rounded-full text-xl font-medium transition transform hover:scale-105 hover:bg-[#D35400] hover:text-white">
                ห้องที่ว่าง
            </button>
            <button onclick="openModal()" class="bg-[#FEFCE8] border-2 border-[#D35400] text-[#D35400] px-4 py-1.5 rounded-full text-xl font-medium transition transform hover:scale-105 hover:bg-[#D35400] hover:text-white">
                นัดจอง
            </button>
        </div>
    </header>
 
    <main class="container mx-auto px-10 flex-1 flex flex-col md:flex-row items-center justify-between">
        
        <div class="md:w-1/2 space-y-6">
            <div class="space-y-1">
                <h1 class="text-8xl font-bold text-gray-900 leading-tight">ยินดีต้อนรับสู่</h1>
                <h2 class="text-5xl font-bold text-[#D35400]">หอพักเพชร</h2>
            </div>
            
            <div class="flex space-x-4 pt-4">  
                <button onclick="gotoPage('Login/Login.html')" class="border-2 border-[#D35400] text-[#D35400] px-8 py-3 rounded-2xl text-3xl font-bold transition transform hover:scale-105 hover:bg-[#D35400] hover:text-white">
                    เข้าสู่ระบบ
                </button>
                <button onclick="gotoPage('Login/Register.html')" class="border-2 border-[#D35400] text-[#D35400] px-8 py-3 rounded-2xl text-3xl font-bold transition transform hover:scale-105 hover:bg-[#D35400] hover:text-white">
                    สมัครสมาชิก
                </button>
            </div>
        </div>
 
        <div class="md:w-1/2 flex justify-end mt-12 md:mt-0">
            <div class="relative w-80 h-80 md:w-[600px] md:h-[600px] overflow-hidden rounded-full border-4 border-white shadow-2xl">
                <img src="./img/home.jpg" alt="หอพักเพชร" class="w-full h-full object-cover relative z-10">
                <div class="absolute inset-0 rounded-full shadow-inner z-20"></div>
            </div>
        </div>
 
    </main>
 
    <script>
        function gotoPage(page) {
            window.location.href = page;
        }
        function openModal() {
            document.getElementById("contactModal").classList.remove("hidden");
        }
        function closeModal() {
            document.getElementById("contactModal").classList.add("hidden");
        }
    </script>
 
    <div id="contactModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-3xl shadow-2xl p-10 w-[90%] max-w-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black text-2xl">
                ✕
            </button>
            <h2 class="text-3xl font-bold text-center mb-8">ติดต่อ</h2>
            <div class="flex flex-col md:flex-row items-center justify-center gap-10 w-full">
                <img src="img/qr.png" class="w-56 h-56 object-contain md:w-64">
                <div class="text-center md:text-left space-y-4 flex flex-col items-center md:items-start">
                    <a href="img/qr.png" download class="bg-[#D35400] text-white px-6 py-3 rounded-full shadow hover:scale-105 transition inline-block md:mr-6">
                        ⬇ บันทึก QR code
                    </a>
                    <p class="text-gray-500 md:ml-12">หรือโทร</p>
                    <p class="text-[#D35400] text-xl font-semibold md:ml-2">
                        066-089-0158
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
