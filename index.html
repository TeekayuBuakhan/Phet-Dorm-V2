<!DOCTYPE html>
<html lang="th">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>หอพักเพชร-ยินดีต้อนรับ</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        'phet-bg': '#F3F4F6',
                        'phet-orange': '#D35400',
                        'btn-green': '#34D399',
                    },
                },
            },
        }
   </script>
   <style>
        body {
            background-image: url('img/home.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
   </style>
</head>
<body class="text-gray-100 font-sans min-h-screen flex flex-col relative">

    <div class="absolute inset-0 bg-black/70"></div>

    <header class="relative z-10 px-6 py-3 flex items-center justify-between border-b border-white/10">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded flex items-center justify-center text-phet-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/><path d="M2 9h20"/><path d="M12 21V9"/><path d="M18 3l-6 6"/><path d="M6 3l6 6"/></svg>
            </div>
            <div class="w-[4px] h-12 bg-phet-orange"></div>
            <h1 class="text-xl font-bold tracking-wide text-white">หอพักเพชร</h1>
        </div>

        <div class="flex space-x-4">
            <button onclick="gotoPage('Vacant/vacant_room.html')" class="border-2 border-white/60 text-white px-4 py-1.5 rounded-full text-sm font-medium transition transform hover:scale-105 hover:bg-white hover:text-gray-900">
                ห้องที่ว่าง
            </button>
            <button onclick="openModal()" class="border-2 border-white/60 text-white px-4 py-1.5 rounded-full text-sm font-medium transition transform hover:scale-105 hover:bg-white hover:text-gray-900">
                นัดจอง
            </button>
        </div>
    </header>

    <main class="relative z-10 container mx-auto px-10 py-12 flex-1 flex flex-col justify-center">
        <div class="max-w-3xl">
            <div class="space-y-6">
                <div>
                    <h1 class="text-5xl font-bold text-white leading-tight">ยินดีต้อนรับสู่</h1>
                    <h2 class="text-4xl font-bold text-phet-orange mt-2">หอพักเพชร</h2>
                </div>

                <div class="flex space-x-4 pt-4">
                    <button onclick="gotoPage('Login/Login.html')" class="bg-phet-orange text-white px-10 py-4 rounded-full text-2xl font-bold shadow-lg transition transform hover:scale-105 hover:bg-orange-700">
                        เข้าสู่ระบบ
                    </button>
                    <button onclick="gotoPage('Login/Register.html')" class="border-2 border-white/70 text-white px-10 py-4 rounded-full text-2xl font-bold transition transform hover:scale-105 hover:bg-white hover:text-gray-900">
                        สมัครสมาชิก
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function gotoPage(page) {
            window.location.href = page;
        }
        function openModal() {
            document.getElementById("contactModal").classList.remove("hidden");
        }
        function closeModal() {
            document.getElementById("contactModal").classList.add("hidden");
        }
    </script>

    <div id="contactModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-3xl shadow-2xl p-10 w-[90%] max-w-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black text-2xl">
                ✕
            </button>
            <h2 class="text-3xl font-bold text-center mb-8">ติดต่อ</h2>
            <div class="flex flex-col md:flex-row items-center justify-center gap-10 w-full">
                <img src="img/qr.png" class="w-56 h-56 object-contain md:w-64">
                <div class="text-center md:text-left space-y-4 flex flex-col items-center md:items-start">
                    <a href="img/qr.png" download class="bg-phet-orange text-white px-6 py-3 rounded-full shadow hover:scale-105 transition inline-block md:mr-6">
                        ⬇ บันทึก QR code
                    </a>
                    <p class="text-gray-500 md:ml-12">หรือโทร</p>
                    <p class="text-phet-orange text-xl font-semibold md:ml-2">
                        066-089-0158
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
