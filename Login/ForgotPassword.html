<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - หอพักเพชร</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FEFCE8] min-h-screen flex flex-col font-sans">

    <header class="bg-[#B3D8E8] px-6 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <img src="../img/petch.logo.png" alt="หอพักเพชร" class="w-12 h-12">
            <div class="w-[4px] h-12 bg-[#D35400]"></div> 
            <h1 class="text-3xl font-bold text-gray-800">หอพักเพชร</h1>
        </div>
    </header>
        
    <main class="flex-1 flex items-center justify-center px-6 py-10">
        <div class="bg-white p-8 rounded-[32px] shadow-2xl w-full max-w-md border-2 border-[#A5D8F3] relative">
            
            <button onclick="window.history.back()" 
                    class="absolute top-6 right-6 text-gray-400 hover:text-[#D35400] transition-all transform hover:scale-110 active:scale-95" 
                    title="ย้อนกลับ">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z" />
                </svg>
            </button>

            <h2 class="text-3xl font-bold text-center text-[#1E3A8A] mb-4 mt-4">ลืมรหัสผ่าน?</h2>
            <p class="text-center text-gray-500 mb-8 text-sm">กรุณากรอกชื่อผู้ใช้งานเเละเบอร์โทรศัพท์ เพื่อทำการตรวจสอบและตั้งค่ารหัสผ่านใหม่</p>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">ชื่อผู้ใช้งาน</label>
                <input type="text" 
                    id="username" 
                    placeholder="กรอกชื่อผู้ใช้งาน"
                    class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-[#D35400] outline-none transition">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">เบอร์โทรศัพท์</label>
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="เบอร์โทรศัพท์ 10 หลัก"
                    maxlength="10"
                    inputmode="numeric"
                    oninput="this.value = this.value.replace(/\D/g, '')"
                    class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-[#D35400] outline-none transition"
                >
            </div>

            <button onclick="handleResetRequest()" class="w-full bg-[#D35400] text-white py-4 rounded-2xl font-bold text-xl shadow-lg hover:bg-[#A04000] transition transform hover:scale-[1.02] active:scale-95">
                ส่งคำขอ
            </button>
            
        </div>
    </main>

<script>
    function handleResetRequest() {
        const user = document.getElementById('username').value;
        const phone = document.getElementById('phone').value;

        if (!user || !phone) {
            alert("กรุณากรอกข้อมูลให้ครบถ้วนครับ");
            return;
        }

        if (phone.length !== 10) {
            alert("กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลัก");
            return;
        }

        window.location.href = 'otp.html?phone=' + phone;
    }
</script>
</body>
</html>
