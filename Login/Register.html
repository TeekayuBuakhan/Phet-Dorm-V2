<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        'phet-bg': '#F4F5F7',
                        'sidebar-bg': '#FFFFFF',
                        'phet-orange': '#D35400',
                        'btn-green': '#22C55E',
                    },
                },
            },
        }
    </script>
    <style>
        body { background-color: #F8F9FB; }
    </style>
    <body class="bg-[#F8F9FB] min-h-screen font-sans">

        <header class="bg-white px-6 py-3 flex items-center justify-between shadow-sm border-b border-gray-200">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded flex items-center justify-center text-phet-orange">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/><path d="M2 9h20"/><path d="M12 21V9"/><path d="M18 3l-6 6"/><path d="M6 3l6 6"/></svg>
            </div>
            <div class="w-[4px] h-8 bg-[#D35400]"></div> 
            <h1 class="text-xl font-bold tracking-wide text-phet-orange">หอพักเพชร</h1>
        </div>
            <div class="flex space-x-4">
                <button onclick="window.location.href='Login.html'" class="bg-white border-2 border-[#D35400] text-[#D35400] px-4 py-1.5 rounded-full text-xl font-medium transition transform hover:scale-105 hover:bg-[#D35400] hover:text-white">
                    เข้าสู่ระบบ
                </button>
            </div>
        
        </header>
        
            <main class="flex-1 flex items-center justify-center px-10 py-10">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border-2 border-gray-200">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">สมัครสมาชิก</h2>

            <form id="registerForm">

        
        
            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">ชื่อ - นามสกุล</label>
                <input type="text" 
                    id="fullName" 
                    placeholder="กรอกชื่อ-นามสกุล"
                    autocomplete="name"
                    class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-[#D35400] outline-none transition">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">อีเมล</label>
                <input type="email" 
                    id="email" 
                    placeholder="กรอกอีเมล (ใช้เข้าสู่ระบบ)"
                    autocomplete="email"
                    class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-[#D35400] outline-none transition">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">เบอร์โทรศัพท์</label>
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="เบอร์โทรศัพท์ 10 หลัก เช่น 0812345678"
                    maxlength="10"
                    inputmode="numeric"
                    oninput="this.value = this.value.replace(/\D/g, '')"
                    class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-[#D35400] outline-none transition"
                >
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">รหัสผ่าน</label>
                <input type="password" 
                    id="password" 
                    placeholder="กรอกรหัสผ่าน"
                    autocomplete="new-password"
                    class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-[#D35400] outline-none transition">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">ยืนยันรหัสผ่าน</label>
                <input type="password" 
                    id="confirmPassword" 
                    placeholder="กรอกรหัสผ่านอีกครั้ง"
                    autocomplete="new-password"
                    class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-[#D35400] outline-none transition">
            </div>

            <p id="formMessage" class="hidden mb-4 text-sm font-medium"></p>

            <button type="submit" id="submitBtn" class="w-full bg-[#D35400] text-white py-3 rounded-xl font-bold text-lg hover:bg-[#A04000] transition transform hover:scale-105">
                ตกลง
            </button>
            </form>
        </div>
        </main>

        <script type="module" src="../js/register.js"></script>

    </body>
</html>
