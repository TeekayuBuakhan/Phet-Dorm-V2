<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#1E40AF',
                        'secondary': '#FBBF24',
                    },
                },
            },
        }
    </script>
    <body class="bg-[#FEFCE8] min-h-screen ">

        <header class="bg-[#B3D8E8] px-6 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <img src="../img/petch.logo.png" alt="หอพักเพชร" class="w-12 h-12">
            <div class="w-[4px] h-12 bg-[#D35400]"></div> 
            <h1 class="text-3xl font-bold text-gray-800">หอพักเพชร</h1>
        </div>
            <div class="flex space-x-4">
                <button onclick="gotoPage('Login.html')" class="bg-[#FEFCE8] border-2 border-[#D35400] text-[#D35400] px-4 py-1.5 rounded-full text-xl font-medium transition transform hover:scale-105 hover:bg-[#D35400] hover:text-white">
                    เข้าสู่ระบบ
                </button>
            </div>
        
        </header>
        
            <main class="flex-1 flex items-center justify-center px-10 py-10">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border-2 border-[#C5E4F3]">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">สมัครสมาชิก</h2>

        
        
            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">ชื่อผู้ใช้งาน</label>
                <input type="text" 
                    id="username" 
                    placeholder="กรอกชื่อผู้ใช้งาน"
                    class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-[#D35400] outline-none transition">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">เบอร์โทรศัพท์</label>
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="เบอร์โทรศัพท์ 10 หลัก"
                    maxlength="10"
                    inputmode="numeric"
                    oninput="this.value = this.value.replace(/\D/g, '')"
                    class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-[#D35400] outline-none transition"
                >
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 mb-2 font-medium">รหัสผ่าน</label>
                <input type="password" 
                    id="password" 
                    placeholder="กรอกรหัสผ่าน"
                    class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-[#D35400] outline-none transition">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 mb-2 font-medium">ยืนยันรหัสผ่าน</label>
                <input type="password" 
                    id="confirmPassword" 
                    placeholder="กรอกรหัสผ่านอีกครั้ง"
                    class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-[#D35400] outline-none transition">
            </div>

            <button onclick="handleRegister()" class="w-full bg-[#D35400] text-white py-3 rounded-xl font-bold text-lg hover:bg-[#A04000] transition transform hover:scale-105">
                ตกลง
            </button>
        </div>
        </main>
        <script>
            function gotoPage(page) {
                window.location.href = page;
            }
            function handleRegister() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const phone = document.getElementById('phone').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                

                if (!username || !password || !confirmPassword) {
                    alert("กรุณากรอกข้อมูลให้ครบถ้วน");
                    return;
                }

                if (password !== confirmPassword) {
                    alert("รหัสผ่านไม่ตรงกัน");
                    return;
                }

                if (!/^\d{10}$/.test(phone)) {
                    alert("กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลัก");
                    return;
                }

                let users = JSON.parse(localStorage.getItem('users')) || [];
            
                if (users.some(user => user.username === username)) {
                    alert("ชื่อผู้ใช้งานนี้มีอยู่แล้ว");
                    return;
                }

                users.push({ username, password });
                localStorage.setItem('users', JSON.stringify(users));

                alert("สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ");
                window.location.href = 'Login.html';
            }
        </script>

    </body>
</html>
